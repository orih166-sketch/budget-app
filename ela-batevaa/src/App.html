const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (s) => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v) => { const n = Number(String(v === undefined || v === null ? '' : v).replace(/[^\d.\-]/g, '')); return isFinite(n) ? n : 0; };
const round2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
const moneyText = (n) => '₪' + round2(n).toLocaleString('he-IL', { maximumFractionDigits: 2 });
const money = (n) => '<span class="num">' + (n < 0 ? '−' : '') + moneyText(Math.abs(n)) + '</span>';
const pad2 = (n) => String(n).padStart(2, '0');
const isoOf = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const todayIso = () => isoOf(new Date());
const parseIso = (s) => { const p = String(s || '').split('-').map(Number); return new Date(p[0], (p[1] || 1) - 1, p[2] || 1); };
const addDays = (iso, n) => { const d = parseIso(iso); d.setDate(d.getDate() + Number(n)); return isoOf(d); };
const daysBetween = (a, b) => Math.round((parseIso(b) - parseIso(a)) / 86400000);
const firstName = (n) => String(n || '').trim().split(/\s+/)[0] || '';
const initials = (n) => { const w = String(n || '').trim().split(/\s+/).filter(Boolean); return esc(((w[0] || '')[0] || '') + ((w[1] || '')[0] || '')); };
const plural = (n, one, many) => (n === 1 ? one : n + ' ' + many);
const uidLocal = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

function fmtDate(iso, withYear) {
  if (!iso) return '';
  const d = parseIso(iso);
  const sameYear = d.getFullYear() === new Date().getFullYear();
  return d.getDate() + ' ב' + MONTHS[d.getMonth()] + (withYear || !sameYear ? ' ' + d.getFullYear() : '');
}
function fmtShort(iso) {
  if (!iso) return '';
  const d = parseIso(iso);
  return d.getDate() + '.' + (d.getMonth() + 1) + '.' + String(d.getFullYear()).slice(2);
}
function relDays(iso) {
  const n = daysBetween(todayIso(), iso);
  if (n === 0) return 'היום';
  if (n === 1) return 'מחר';
  if (n === -1) return 'אתמול';
  if (n === 2) return 'בעוד יומיים';
  if (n === -2) return 'לפני יומיים';
  return n > 0 ? 'בעוד ' + n + ' ימים' : 'לפני ' + Math.abs(n) + ' ימים';
}
function cleanPhone(p) {
  let d = String(p || '').replace(/\D/g, '');
  if (d.startsWith('972')) d = '0' + d.slice(3);
  if (d.length === 9 && d[0] === '5') d = '0' + d;
  return d;
}
function prettyPhone(p) {
  const d = cleanPhone(p);
  if (d.length === 10) return d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6);
  return d;
}
function waLink(phone, text) {
  let d = cleanPhone(phone);
  if (d.startsWith('0')) d = '972' + d.slice(1);
  const q = text ? '?text=' + encodeURIComponent(text) : '';
  return 'https://wa.me/' + (d || '') + q;
}

}
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    ta.remove();
    return ok;
  }
}
function fillTemplate(text, ctx) {

}

function loadScript(key) {

  if (key === 'jspdf' && window.jspdf) return Promise.resolve();
  if (key === 'xlsx' && window.XLSX) return Promise.resolve();

    const s = document.createElement('script');

/* =========================================================
   State & server API
   ========================================================= */
const state = {
  data: null,
  view: 'home',
  tab: {},
  q: {},
  year: new Date().getFullYear(),
  month: 'all',
  busy: 0,
};
const S = () => (state.data && state.data.settings) || {};

// Emoji (characters outside the BMP) can get mangled by google.script.run, so every call
// goes through a single rpc() entry point with JSON that has those characters \u-escaped.
const packJson = (v) => JSON.stringify(v).replace(/[\ud800-\udfff]/g, (c) => '\\u' + c.charCodeAt(0).toString(16));
const unpackJson = (r) => (typeof r === 'string' ? JSON.parse(r) : r);

function call(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  setBusy(1);
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler((r) => { setBusy(-1); resolve(unpackJson(r)); })
      .withFailureHandler((e) => {
        setBusy(-1);
        const msg = (e && e.message) || String(e);
        toast(msg.replace(/^Exception:\s*/, ''), { error: true });
        reject(e);
      })
      .rpc(fn, packJson(args));
  });
}
function setBusy(d) {
  state.busy = Math.max(0, state.busy + d);
  let bar = $('#loadingBar');
  if (state.busy && !bar) {
    bar = document.createElement('div'); bar.id = 'loadingBar'; bar.className = 'loading-bar';
    document.body.appendChild(bar);
  } else if (!state.busy && bar) bar.remove();
}
function applyResult(r) {
  if (!r) return r;
  if (r.settings) state.data.settings = r.settings;
  Object.keys(r.changes || {}).forEach((t) => {
    const list = state.data[t] || (state.data[t] = []);
    (r.changes[t] || []).forEach((rec) => {
      const i = list.findIndex((x) => x.id === rec.id);
      if (i >= 0) list[i] = rec; else list.push(rec);
    });
  });
  Object.keys(r.removed || {}).forEach((t) => {
    state.data[t] = (state.data[t] || []).filter((x) => r.removed[t].indexOf(x.id) === -1);
  });
  return r;
}
async function mutate(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  const r = await call.apply(null, [fn].concat(args));
  applyResult(r);
  render();
  return r;
}
const saveRec = (table, rec) => mutate('saveRecord', table, rec);
const delRec = (table, id) => mutate('deleteRecord', table, id);

/* =========================================================

   ========================================================= */
function activeSales() { return D('sales').filter((s) => s.status !== 'cancelled'); }
function customerStats() {
  const m = {};
  activeSales().forEach((s) => {
    if (!s.customerId) return;
    const c = m[s.customerId] || (m[s.customerId] = { count: 0, total: 0, last: '' });
    c.count++; c.total += Number(s.total) || 0;
    if (s.date > c.last) c.last = s.date;
  });
  return m;
}
function customerById(id) { return D('customers').find((c) => c.id === id); }
function productById(id) { return D('products').find((p) => p.id === id); }
function sumIncome(filter) { return activeSales().filter(filter).reduce((s, x) => s + (Number(x.total) || 0), 0); }
function sumExpense(filter) { return D('expenses').filter(filter).reduce((s, x) => s + (Number(x.amount) || 0), 0); }
function openFollowups() { return D('followups').filter((f) => f.status === 'open'); }
function dueFollowups() { const t = todayIso(); return openFollowups().filter((f) => f.due <= t).sort((a, b) => a.due.localeCompare(b.due)); }
function stockStatus(p) {
  const s = Number(p.stock) || 0;
  if (s <= 0) return 'out';
  if (s <= (Number(p.minStock) || 0)) return 'low';
  return 'ok';
}
function activeProducts() { return D('products').filter((p) => p.active !== false); }
function followupLabel(type) {
  if (type === 'check3') return 'בדיקה אחרי ' + (S().checkDays || 3) + ' ימים';
  if (type === 'renew30') return 'הצעת חידוש';
  if (type === 'lead') return 'מעקב ליד';
  return 'תזכורת';
}

  return D('templates').filter((t) => !cat || t.category === cat).sort((a, b) => (a.order || 0) - (b.order || 0));
}

/* =========================================================
   Toast & modal
   ========================================================= */
function toast(msg, opts) {
  opts = opts || {};
  const el = document.createElement('div');
  el.className = 'toast' + (opts.error ? ' err' : '');
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (opts.action ? '<button type="button">' + esc(opts.action) + '</button>' : '');
  if (opts.action) el.querySelector('button').onclick = () => { el.remove(); opts.onAction(); };
  $('#toastRoot').appendChild(el);
  setTimeout(() => el.remove(), opts.action ? 7000 : (opts.error ? 6000 : 2800));
}

function modal(o) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML =
    '<div class="modal ' + (o.wide ? 'wide' : '') + '" role="dialog" aria-modal="true">' +
      '<div class="modal-head"><h3>' + esc(o.title) + '</h3><button class="icon-btn sm" data-close aria-label="סגירה">' + icon('x') + '</button></div>' +
      '<div class="modal-body">' + (o.body || '') + '</div>' +
      (o.foot ? '<div class="modal-foot">' + o.foot + '</div>' : '') +
    '</div>';
  const close = () => { ov.remove(); if (o.onClose) o.onClose(); };
  ov.addEventListener('mousedown', (e) => { if (e.target === ov) ov._down = true; });
  ov.addEventListener('click', (e) => {
    if ((e.target === ov && ov._down) || e.target.closest('[data-close]')) close();
    ov._down = false;
  });
  $('#modalRoot').appendChild(ov);
  const m = { el: ov, body: $('.modal-body', ov), close: close, $: (s) => $(s, ov), $$: (s) => $$(s, ov) };
  if (o.onMount) o.onMount(m);
  const first = $('[autofocus]', ov);
  if (first && window.innerWidth > 720) setTimeout(() => first.focus(), 30);
  return m;
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const all = $$('#modalRoot .overlay');
    if (all.length) all[all.length - 1].querySelector('[data-close]').click();
  }
});

function confirmBox(title, text, okLabel, danger) {
  return new Promise((resolve) => {
    let done = false;
    const m = modal({
      title: title,
      body: '<p style="margin:0">' + esc(text) + '</p>',
      foot: '<button class="btn ' + (danger ? 'danger' : '') + '" data-ok>' + esc(okLabel || 'אישור') + '</button><button class="btn secondary" data-close>ביטול</button>',
      onClose: () => { if (!done) resolve(false); },
    });
    m.$('[data-ok]').onclick = () => { done = true; m.close(); resolve(true); };
  });
}

  $('#sidebar').innerHTML =

    NAV.map((n) => '<button class="navlink ' + (state.view === n.id ? 'active' : '') + '" data-action="go" data-view="' + n.id + '">' + icon(n.icon) + '<span>' + n.label + '</span>' + badge(n.id) + '</button>').join('') +
    '<div class="spacer"></div>' +
    '<div class="side-foot">' + esc((state.data.meta && state.data.meta.email) || '') + '</div>';

  $('#bottomnav').innerHTML = BOTTOM.map((id) => {
    const n = NAV.find((x) => x.id === id);
    return '<button class="' + (state.view === id ? 'active' : '') + '" data-action="go" data-view="' + id + '">' + icon(n.icon) +
      '<span>' + (n.short || n.label) + '</span>' + (id === 'followups' && due ? '<span class="dot">' + due + '</span>' : '') + '</button>';
  }).join('') +
    '<button class="' + (BOTTOM.indexOf(state.view) === -1 ? 'active' : '') + '" data-action="moreMenu">' + icon('more') + '<span>עוד</span></button>';

function topbar(title, sub, actions) {
  $('#topbar').innerHTML =
    (state.view === 'home' ? '<img class="mini-logo" src="' + LOGO_SRC + '" alt="אלה בטבע">' : '<div><h1>' + esc(title) + '</h1>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>') +
    '<div class="actions">' + (actions || '') + '</div>';
}

function render() {
  if (!state.data) return;
  const focused = document.activeElement && document.activeElement.id === 'q' ? document.activeElement.selectionStart : null;
  renderChrome();
  const v = VIEWS[state.view] || VIEWS.home;
  $('#view').innerHTML = v();
  $('.fab').hidden = ['settings', 'templates'].indexOf(state.view) !== -1;
  if (focused !== null) {
    const q = $('#q');
    if (q) { q.focus(); q.setSelectionRange(focused, focused); }
  }
}

/* =========================================================
   Shared fragments
   ========================================================= */
function emptyState(title, text, action) {
  return '<div class="empty"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M12 54C12 30 28 12 54 10c0 26-17 44-42 44z" fill="#E9ECDB"/><path d="M12 54 38 28" stroke="#A2AD82" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>' +
    '<b>' + esc(title) + '</b><div>' + esc(text || '') + '</div>' + (action ? '<div style="margin-top:14px">' + action + '</div>' : '') + '</div>';
}
function searchBox(view, placeholder) {
  return '<label class="search">' + icon('search') + '<input id="q" data-input="search" data-view="' + view + '" placeholder="' + esc(placeholder) + '" value="' + esc(state.q[view] || '') + '" autocomplete="off"></label>';
}
function tabs(view, items) {
  const cur = state.tab[view] || items[0][0];
  return '<div class="tabs">' + items.map((t) => '<button class="tab ' + (cur === t[0] ? 'active' : '') + '" data-action="tab" data-view="' + view + '" data-tab="' + t[0] + '">' + esc(t[1]) +
    (t[2] !== undefined ? ' <span class="count">' + t[2] + '</span>' : '') + '</button>').join('') + '</div>';
}
function curTab(view, def) { return state.tab[view] || def; }
function matches(q, fields) {
  if (!q) return true;
  q = q.trim().toLowerCase();
  return fields.some((f) => String(f || '').toLowerCase().indexOf(q) !== -1 || (cleanPhone(f) && cleanPhone(q) && cleanPhone(f).indexOf(cleanPhone(q)) !== -1));
}

function followupRow(f) {
  const overdue = f.due < todayIso();
  const cls = f.type === 'renew30' ? 'brown' : f.type === 'lead' ? 'warn' : '';
  return '<div class="fu">' +
    '<div class="avatar sm ' + (f.type === 'lead' ? 'lead' : '') + '">' + initials(f.customerName) + '</div>' +
    '<div class="grow">' +
      '<div class="top"><span class="name">' + esc(f.customerName) + '</span><span class="badge ' + cls + '">' + esc(followupLabel(f.type)) + '</span>' +
      (f.status === 'open' ? '<span class="badge ' + (overdue ? 'danger' : 'plain') + '">' + icon('clock') + ' ' + relDays(f.due) + '</span>' : '<span class="badge plain">' + (f.status === 'done' ? 'בוצע' : 'דולג') + ' · ' + fmtShort(f.doneAt || f.due) + '</span>') + '</div>' +
      (f.products || f.note ? '<div class="what">' + esc(f.products || '') + (f.products && f.note ? ' · ' : '') + esc(f.note || '') + '</div>' : '') +
      (f.status === 'open' ? '<div class="acts">' +
        '<button class="btn wa sm" data-action="fuWa" data-id="' + f.id + '">' + icon('wa') + 'שליחה בוואטסאפ</button>' +
        '<button class="btn secondary sm" data-action="fuDone" data-id="' + f.id + '">' + icon('check') + 'בוצע</button>' +
        '<button class="btn ghost sm" data-action="fuSnooze" data-id="' + f.id + '">' + icon('clock') + 'דחייה</button>' +
        (f.type === 'renew30' ? '<button class="btn ghost sm" data-action="newSale" data-customer="' + f.customerId + '">' + icon('cart') + 'מכירה</button>' : '') +
      '</div>' : '') +
    '</div></div>';
}

function customerRow(c, stats) {
  const st = stats[c.id];
  let meta;
  if (c.type === 'lead') meta = 'ליד · ' + esc(c.stage || 'חדש') + (c.createdAt ? ' · נוסף ' + relDays(c.createdAt.slice(0, 10)) : '');
  else if (st) meta = plural(st.count, 'רכישה אחת', 'רכישות') + ' · אחרונה ' + relDays(st.last);
  else meta = 'עדיין אין רכישות';
  return '<button class="row" data-action="openCustomer" data-id="' + c.id + '">' +
    '<div class="avatar ' + (c.type === 'lead' ? 'lead' : '') + '">' + initials(c.name) + '</div>' +
    '<div class="grow"><div class="title">' + esc(c.name) + (c.club ? ' <span class="badge" style="vertical-align:1px">מועדון</span>' : '') + '</div><div class="meta">' + meta + '</div></div>' +
    (c.phone ? '<span class="icon-btn wa sm" role="button" data-action="quickMsg" data-customer="' + c.id + '" aria-label="הודעה בוואטסאפ">' + icon('wa') + '</span>' : '') +
  '</button>';
}

function saleRow(s) {
  const items = (s.items || []).map((i) => i.name + (i.qty > 1 ? ' ×' + i.qty : '')).join(', ');
  return '<button class="row" data-action="openSale" data-id="' + s.id + '">' +
    '<div class="avatar sm">' + icon(s.kind === 'other' ? 'gift' : 'receipt') + '</div>' +
    '<div class="grow"><div class="title">' + esc(s.customerName || items || 'הכנסה') + '</div>' +
    '<div class="meta">' + fmtShort(s.date) + (s.receiptNo ? ' · קבלה ' + receiptLabel(s.receiptNo) : '') + ' · ' + esc(s.payment || '') + (s.customerName && items ? ' · ' + esc(items) : '') + '</div></div>' +
    '<div class="end"><div class="amount">' + money(s.total) + '</div>' + (s.status === 'cancelled' ? '<span class="badge danger">בוטלה</span>' : '') + '</div>' +
  '</button>';
}

function expenseRow(x) {
  return '<button class="row" data-action="editExpense" data-id="' + x.id + '">' +
    '<div class="avatar sm" style="background:var(--brown-soft);color:var(--brown)">' + icon('wallet') + '</div>' +
    '<div class="grow"><div class="title">' + esc(x.description || x.category) + '</div><div class="meta">' + fmtShort(x.date) + ' · ' + esc(x.category) + (x.payment ? ' · ' + esc(x.payment) : '') + '</div></div>' +
    '<div class="end"><div class="amount neg">' + money(x.amount) + '</div></div></button>';
}

VIEWS.followups = function () {
  const t = todayIso();
  const open = openFollowups();
  const due = open.filter((f) => f.due <= t);
  const week = open.filter((f) => f.due > t && f.due <= addDays(t, 7));
  const later = open.filter((f) => f.due > addDays(t, 7));
  const done = D('followups').filter((f) => f.status !== 'open').sort((a, b) => String(b.doneAt || b.due).localeCompare(String(a.doneAt || a.due)));
  const tab = curTab('followups', 'due');
  const q = state.q.followups;
  let list = tab === 'due' ? due : tab === 'week' ? week : tab === 'later' ? later : done.slice(0, 80);
  if (tab !== 'done') list = list.slice().sort((a, b) => a.due.localeCompare(b.due));
  list = list.filter((f) => matches(q, [f.customerName, f.phone, f.products, f.note]));

  topbar('פולואפים', 'מעקב אחרי לקוחות ולידים · נוצרים אוטומטית אחרי כל מכירה',
    '<button class="btn sm" data-action="newReminder">' + icon('plus') + 'תזכורת</button>');

  return tabs('followups', [['due', 'היום ובאיחור', due.length], ['week', '7 ימים קרובים', week.length], ['later', 'בהמשך', later.length], ['done', 'בוצעו']]) +
    '<div class="toolbar" style="margin:0 0 12px">' + searchBox('followups', 'חיפוש לפי שם או מוצר') + '</div>' +
    '<div class="card">' + (list.length ? list.map(followupRow).join('') : emptyState(tab === 'due' ? 'אין משימות להיום' : 'אין פריטים', tab === 'due' ? 'כל הכבוד, הכול מטופל 🌿' : '')) + '</div>';
};

VIEWS.customers = function () {
  const stats = customerStats();
  const t = todayIso();
  const inactiveDays = num(S().inactiveDays) || 60;
  const all = D('customers');
  const leads = all.filter((c) => c.type === 'lead');
  const custs = all.filter((c) => c.type !== 'lead');
  const club = all.filter((c) => c.club);
  const sleepy = custs.filter((c) => stats[c.id] && daysBetween(stats[c.id].last, t) >= inactiveDays);
  const tab = curTab('customers', 'all');
  const q = state.q.customers;
  let list = tab === 'leads' ? leads : tab === 'customers' ? custs : tab === 'club' ? club : tab === 'sleepy' ? sleepy : all;
  list = list.filter((c) => matches(q, [c.name, c.phone, c.notes]));
  list.sort((a, b) => {
    const la = (stats[a.id] && stats[a.id].last) || String(a.createdAt || '');

  topbar('לקוחות ולידים', all.length + ' אנשי קשר · ' + leads.length + ' לידים',
    '<button class="btn secondary sm" data-action="newCustomer">' + icon('plus') + 'לקוח</button><button class="btn sm" data-action="newLead">' + icon('plus') + 'ליד</button>');

  return tabs('customers', [['all', 'הכול', all.length], ['leads', 'לידים', leads.length], ['customers', 'לקוחות', custs.length], ['club', 'במועדון', club.length], ['sleepy', 'לשימור', sleepy.length]]) +
    '<div class="toolbar" style="margin:0 0 12px">' + searchBox('customers', 'חיפוש לפי שם או טלפון') + '</div>' +
    '<div class="card list">' + (list.length ? list.map((c) => customerRow(c, stats)).join('') : emptyState('לא נמצאו אנשי קשר', q ? 'נסי חיפוש אחר' : 'הוסיפי ליד או לקוח ראשון', q ? '' : '<button class="btn sm" data-action="newLead">' + icon('plus') + 'ליד חדש</button>')) + '</div>';
};

  '<div class="grid grid-4">' +

function customerForm(c, isLead) {
  c = c || {};

  return '<div class="form-grid">' +
    '<div class="field full"><label for="c_name">שם מלא</label><input class="input" id="c_name" value="' + esc(c.name) + '" autofocus></div>' +

    '<div class="field"><label for="c_bday">יום הולדת</label><input class="input" id="c_bday" type="date" value="' + esc(c.birthday) + '"></div>' +
    (lead ? '<div class="field full"><label>שלב</label><div class="segmented" id="c_stage">' + LEAD_STAGES.map((s) => '<button type="button" class="' + ((c.stage || 'חדש') === s ? 'on' : '') + '" data-v="' + s + '">' + s + '</button>').join('') + '</div></div>' : '') +
    '<div class="field full"><label for="c_notes">הערות</label><textarea class="input" id="c_notes" placeholder="מה מעניין אותה/אותו, רגישויות, העדפות...">' + esc(c.notes) + '</textarea></div>' +
    '<label class="switch full"><input type="checkbox" id="c_club" ' + (c.club ? 'checked' : '') + '> חבר/ה במועדון הלקוחות</label>' +
    (!c.id && lead ? '<label class="switch full"><input type="checkbox" id="c_remind" checked> תזכורת לחזור אליו/ה בעוד <input class="input" id="c_remind_days" type="number" value="2" style="width:70px;min-height:36px;padding:4px 8px"> ימים</label>' : '') +
  '</div>';
}
function bindSegmented(root) {
  $$('.segmented', root).forEach((seg) => seg.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    $$('button', seg).forEach((x) => x.classList.toggle('on', x === b));
  }));
}
function segValue(root, sel) { const b = $(sel + ' button.on', root); return b ? b.dataset.v : ''; }

function editCustomer(c, isLead, after) {
  const isNew = !c || !c.id;
  const m = modal({
    title: isNew ? (isLead ? 'ליד חדש' : 'לקוח/ה חדש/ה') : 'עריכת פרטים',
    body: customerForm(c, isLead),
    foot: '<button class="btn" data-save>' + icon('check') + 'שמירה</button>' + (!isNew ? '<button class="btn danger" data-del>' + icon('trash') + 'מחיקה</button>' : '') + '<button class="btn secondary" data-close>ביטול</button>',
    onMount: (m) => bindSegmented(m.el),
  });
  m.$('#c_phone').addEventListener('blur', (e) => { e.target.value = prettyPhone(e.target.value) || e.target.value; });
  m.$('[data-save]').onclick = async () => {
    const name = m.$('#c_name').value.trim();
    if (!name) { m.$('#c_name').focus(); return toast('נא להזין שם', { error: true }); }
    const phone = cleanPhone(m.$('#c_phone').value);
    const dup = phone && D('customers').find((x) => x.phone === phone && x.id !== (c && c.id));
    if (dup && !(await confirmBox('מספר קיים', 'המספר כבר שמור אצל ' + dup.name + '. לשמור בכל זאת?', 'שמירה'))) return;
    const rec = Object.assign({}, c || {}, {
      name: name, phone: phone, birthday: m.$('#c_bday').value, notes: m.$('#c_notes').value.trim(), club: m.$('#c_club').checked,
      type: (c && c.type) || (isLead ? 'lead' : 'customer'),
    });
    if (rec.type === 'lead') rec.stage = segValue(m.el, '#c_stage') || 'חדש';
    const remind = m.$('#c_remind') && m.$('#c_remind').checked;
    const days = m.$('#c_remind_days') ? num(m.$('#c_remind_days').value) : 2;
    const r = await saveRec('customers', rec);
    const saved = r.changes.customers[0];
    if (remind) await saveRec('followups', { customerId: saved.id, customerName: saved.name, phone: saved.phone, type: 'lead', due: addDays(todayIso(), days || 2), status: 'open' });
    m.close();
    toast(isNew ? 'נשמר בהצלחה 🌿' : 'הפרטים עודכנו');
    if (after) after(saved);
  };
  const del = m.$('[data-del]');
  if (del) del.onclick = async () => {
    if (D('sales').some((s) => s.customerId === c.id)) return toast('ללקוח יש קבלות במערכת ולכן לא ניתן למחוק אותו', { error: true });
    if (!(await confirmBox('מחיקת איש קשר', 'למחוק את ' + c.name + '? הפעולה לא ניתנת לביטול.', 'מחיקה', true))) return;
    for (const f of D('followups').filter((f) => f.customerId === c.id)) await call('deleteRecord', 'followups', f.id).then(applyResult);
    await delRec('customers', c.id);
    m.close();
    $$('#modalRoot .overlay').forEach((o) => o.remove());
    toast('נמחק');
  };
}

  const sales = D('sales').filter((s) => s.customerId === id).sort((a, b) => b.date.localeCompare(a.date));
  const fus = D('followups').filter((f) => f.customerId === id && f.status === 'open').sort((a, b) => a.due.localeCompare(b.due));
  const m = modal({

      '<div class="detail-head"><div class="avatar ' + (c.type === 'lead' ? 'lead' : '') + '">' + initials(c.name) + '</div><div style="flex:1;min-width:0"><div class="nm">' + esc(c.name) + '</div>' +

      '<span class="badge ' + (c.type === 'lead' ? 'brown' : '') + '">' + (c.type === 'lead' ? 'ליד · ' + esc(c.stage || 'חדש') : 'לקוח/ה') + '</span>' + (c.club ? '<span class="badge solid">במועדון</span>' : '') +
      (c.birthday ? '<span class="badge plain">🎂 ' + fmtDate(c.birthday) + '</span>' : '') + '</div></div></div>' +
      '<div class="btn-row">' +
        (c.phone ? '<button class="btn wa" data-action="quickMsg" data-customer="' + c.id + '">' + icon('wa') + 'הודעה בוואטסאפ</button>' : '') +
        '<button class="btn" data-action="newSale" data-customer="' + c.id + '">' + icon('cart') + 'מכירה חדשה</button>' +
        '<button class="btn secondary" data-edit>' + icon('edit') + 'עריכה</button>' +
        '<button class="btn ghost" data-action="newReminder" data-customer="' + c.id + '">' + icon('bell') + 'תזכורת</button>' +
      '</div>' +
      (c.type !== 'lead' ? '<div class="kv"><div><div class="k">סה״כ רכישות</div><div class="v">' + money(st.total) + '</div></div><div><div class="k">מספר רכישות</div><div class="v">' + st.count + '</div></div><div><div class="k">רכישה אחרונה</div><div class="v">' + (st.last ? relDays(st.last) : '—') + '</div></div></div>' : '') +
      (c.type === 'lead' ? '<div class="sub-h">שלב הליד</div><div class="segmented" id="stageQuick">' + LEAD_STAGES.map((s) => '<button type="button" class="' + ((c.stage || 'חדש') === s ? 'on' : '') + '" data-v="' + s + '">' + s + '</button>').join('') + '</div>' : '') +
      (c.notes ? '<div class="sub-h">הערות</div><div style="white-space:pre-wrap;background:var(--surface-2);border-radius:12px;padding:10px 12px">' + esc(c.notes) + '</div>' : '') +
      (fus.length ? '<div class="sub-h">פולואפים פתוחים</div><div class="card">' + fus.map(followupRow).join('') + '</div>' : '') +
      '<div class="sub-h">היסטוריית רכישות</div>' + (sales.length ? '<div class="card list">' + sales.map(saleRow).join('') + '</div>' : '<div class="faint">עדיין אין רכישות</div>'),
  });
  m.$('[data-edit]').onclick = () => { m.close(); editCustomer(c, false, (s) => openCustomer(s.id)); };
  const sq = m.$('#stageQuick');
  if (sq) sq.addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    $$('button', sq).forEach((x) => x.classList.toggle('on', x === b));
    await saveRec('customers', Object.assign({}, c, { stage: b.dataset.v }));
    toast('השלב עודכן: ' + b.dataset.v);
  });
}

/* =========================================================
   Quick WhatsApp message
   ========================================================= */
function quickMessage(opts) {
  opts = opts || {};
  let cust = opts.customerId ? customerById(opts.customerId) : null;
  const tpls = templatesFor();
  const startTpl = opts.templateId ? tpls.find((t) => t.id === opts.templateId) : null;
  const lastProducts = () => {
    if (!cust) return '';
    const last = activeSales().filter((s) => s.customerId === cust.id && s.kind === 'sale').sort((a, b) => b.date.localeCompare(a.date))[0];
    return last ? (last.items || []).map((i) => i.name).join(', ') : '';
  };
  const ctx = () => ({ name: cust ? cust.name : '', products: opts.products || lastProducts(), receipt: opts.receipt });
  const m = modal({
    title: 'הודעה מהירה',
    body:
      '<div class="field"><label>אל</label><div id="qm_to"></div></div>' +
      '<div class="field"><label>נוסח</label><div class="tabs" style="margin:0" id="qm_tpls">' + tpls.map((t) => '<button class="tab ' + (startTpl && startTpl.id === t.id ? 'active' : '') + '" data-id="' + t.id + '">' + esc(t.title) + '</button>').join('') + '</div></div>' +
      '<div class="field"><label for="qm_text">ההודעה</label><textarea class="input" id="qm_text" style="min-height:150px"></textarea></div>' +
      '<div class="wa-preview"><div class="wa-bubble" id="qm_prev"></div></div>',
    foot: '<button class="btn wa" data-send>' + icon('wa') + 'פתיחה בוואטסאפ</button><button class="btn secondary" data-copy>' + icon('copy') + 'העתקה</button>',
  });
  const ta = m.$('#qm_text');
  const prev = () => { m.$('#qm_prev').textContent = ta.value || '...'; };
  ta.value = opts.text || (startTpl ? fillTemplate(startTpl.text, ctx()) : '');
  prev();
  ta.addEventListener('input', prev);
  function renderTo() {
    m.$('#qm_to').innerHTML = cust
      ? '<div class="selected-customer"><div class="avatar sm">' + initials(cust.name) + '</div><div class="grow" style="flex:1"><b>' + esc(cust.name) + '</b><div class="muted num" style="font-size:13px">' + esc(prettyPhone(cust.phone)) + '</div></div><button class="btn ghost sm" data-clear>החלפה</button></div>'
      : '<input class="input" id="qm_search" placeholder="שם או מספר טלפון (ריק = בחירה בוואטסאפ)" autocomplete="off"><div class="picker" id="qm_res" hidden style="margin-top:6px"></div>';
    if (cust) m.$('[data-clear]').onclick = () => { cust = null; renderTo(); };
    else {
      const inp = m.$('#qm_search'), res = m.$('#qm_res');
      inp.addEventListener('input', () => {
        const q = inp.value.trim();
        const list = q ? D('customers').filter((c) => matches(q, [c.name, c.phone])).slice(0, 6) : [];
        res.hidden = !list.length;
        res.innerHTML = list.map((c) => '<button class="row" data-id="' + c.id + '"><div class="avatar sm">' + initials(c.name) + '</div><div class="grow"><div class="title">' + esc(c.name) + '</div><div class="meta num">' + esc(prettyPhone(c.phone)) + '</div></div></button>').join('');
      });
      res.addEventListener('click', (e) => {
        const b = e.target.closest('[data-id]'); if (!b) return;
        cust = customerById(b.dataset.id);
        const active = m.$('#qm_tpls .tab.active');
        if (active) ta.value = fillTemplate(tpls.find((t) => t.id === active.dataset.id).text, ctx());
        prev(); renderTo();
      });
    }
  }
  renderTo();
  m.$('#qm_tpls').addEventListener('click', (e) => {
    const b = e.target.closest('.tab'); if (!b) return;
    $$('#qm_tpls .tab', m.el).forEach((x) => x.classList.toggle('active', x === b));
    ta.value = fillTemplate(tpls.find((t) => t.id === b.dataset.id).text, ctx());
    prev();
  });
  m.$('[data-send]').onclick = () => {
    const phone = cust ? cust.phone : (m.$('#qm_search') && /\d{7,}/.test(cleanPhone(m.$('#qm_search').value)) ? m.$('#qm_search').value : '');
    openExternal(waLink(phone, ta.value));
    if (opts.onSent) opts.onSent();
    m.close();
  };
  m.$('[data-copy]').onclick = async () => { toast((await copyText(ta.value)) ? 'ההודעה הועתקה – אפשר להדביק בוואטסאפ' : 'ההעתקה נכשלה', { error: false }); };
}

/* =========================================================
   Sale flow
   ========================================================= */
function newSale(opts) {
  opts = opts || {};
  const draft = {
    customer: opts.customerId ? customerById(opts.customerId) : null,
    newCustomer: null,
    items: [],
    payment: PAYMENTS[0],
    date: todayIso(),
    withReceipt: true,
    followups: true,
    notes: '',
  };
  const m = modal({
    title: 'מכירה חדשה',
    wide: true,
    body:
      '<div class="field"><label>לקוח/ה</label><div id="s_cust"></div></div>' +
      '<div class="field"><label>מוצרים</label><input class="input" id="s_psearch" placeholder="חיפוש מוצר מהמלאי..." autocomplete="off"><div class="picker" id="s_pres" style="margin-top:6px"></div></div>' +
      '<div id="s_cart"></div>' +
      '<div class="total-bar"><span>סה״כ לתשלום</span><b id="s_total">₪0</b></div>' +
      '<div class="field"><label>אמצעי תשלום</label><div class="segmented" id="s_pay">' + PAYMENTS.map((p, i) => '<button type="button" class="' + (i === 0 ? 'on' : '') + '" data-v="' + p + '">' + p + '</button>').join('') + '</div></div>' +
      '<div class="form-grid"><div class="field"><label for="s_date">תאריך</label><input class="input" type="date" id="s_date" value="' + draft.date + '"></div>' +
      '<div class="field"><label for="s_notes">הערה (תופיע בקבלה)</label><input class="input" id="s_notes" placeholder="לא חובה"></div></div>' +
      '<label class="switch"><input type="checkbox" id="s_receipt" checked> הפקת קבלה דיגיטלית (מספר ' + receiptLabel(S().receiptNext) + ')</label>' +
      '<label class="switch"><input type="checkbox" id="s_fu" checked> תזמון פולואפים: בדיקה אחרי ' + (S().checkDays || 3) + ' ימים וחידוש אחרי ' + (S().renewDays || 30) + ' יום</label>',
    foot: '<button class="btn" data-save>' + icon('receipt') + 'שמירה והפקת קבלה</button><button class="btn secondary" data-close>ביטול</button>',
    onMount: (m) => bindSegmented(m.el),
  });

  function renderCust() {
    const box = m.$('#s_cust');
    if (draft.customer) {
      box.innerHTML = '<div class="selected-customer"><div class="avatar sm">' + initials(draft.customer.name) + '</div><div style="flex:1"><b>' + esc(draft.customer.name) + '</b><div class="muted num" style="font-size:13px">' + esc(prettyPhone(draft.customer.phone)) + '</div></div><button class="btn ghost sm" data-clear>החלפה</button></div>';
      $('[data-clear]', box).onclick = () => { draft.customer = null; renderCust(); };
      return;
    }
    if (draft.newCustomer) {
      box.innerHTML = '<div class="form-grid" style="background:var(--sage-softer);border-radius:14px;padding:12px 12px 0"><div class="field"><label for="s_nc_name">שם</label><input class="input" id="s_nc_name" value="' + esc(draft.newCustomer.name) + '"></div>' +
        '<div class="field"><label for="s_nc_phone">טלפון</label><input class="input" type="tel" id="s_nc_phone" value="' + esc(draft.newCustomer.phone) + '"></div></div>' +
        '<button class="btn ghost sm" data-cancel style="margin-top:6px">בחירת לקוח קיים</button>';
      $('#s_nc_name', box).oninput = (e) => { draft.newCustomer.name = e.target.value; };
      $('#s_nc_phone', box).oninput = (e) => { draft.newCustomer.phone = e.target.value; };
      $('[data-cancel]', box).onclick = () => { draft.newCustomer = null; renderCust(); };
      setTimeout(() => $('#s_nc_name', box).focus(), 20);
      return;
    }
    box.innerHTML = '<input class="input" id="s_csearch" placeholder="חיפוש לפי שם או טלפון..." autocomplete="off"><div class="picker" id="s_cres" style="margin-top:6px"></div>';
    const inp = $('#s_csearch', box), res = $('#s_cres', box);
    const draw = () => {
      const q = inp.value.trim();
      const stats = customerStats();
      const list = D('customers').filter((c) => matches(q, [c.name, c.phone]))
        .sort((a, b) => String((stats[b.id] || {}).last || b.createdAt).localeCompare(String((stats[a.id] || {}).last || a.createdAt))).slice(0, q ? 8 : 4);
      res.innerHTML = list.map((c) => '<button class="row" data-id="' + c.id + '"><div class="avatar sm ' + (c.type === 'lead' ? 'lead' : '') + '">' + initials(c.name) + '</div><div class="grow"><div class="title">' + esc(c.name) + '</div><div class="meta num">' + esc(prettyPhone(c.phone)) + '</div></div>' + (c.type === 'lead' ? '<span class="badge brown">ליד</span>' : '') + '</button>').join('') +
        '<button class="row" data-new><div class="avatar sm">' + icon('plus') + '</div><div class="grow"><div class="title">' + (q ? 'לקוח/ה חדש/ה: ' + esc(q) : 'לקוח/ה חדש/ה') + '</div></div></button>';
    };
    inp.addEventListener('input', draw);
    res.addEventListener('click', (e) => {
      const b = e.target.closest('.row'); if (!b) return;
      if (b.hasAttribute('data-new')) {
        const q = inp.value.trim();
        const isPhone = /^[\d\-\s+]{7,}$/.test(q);
        draft.newCustomer = { name: isPhone ? '' : q, phone: isPhone ? q : '' };
      } else draft.customer = customerById(b.dataset.id);
      renderCust();
    });
    draw();
  }

  function renderProducts() {
    const q = m.$('#s_psearch').value.trim();
    const list = activeProducts().filter((p) => matches(q, [p.name, p.code, p.category])).sort((a, b) => a.name.localeCompare(b.name, 'he')).slice(0, q ? 12 : 6);
    m.$('#s_pres').innerHTML = list.map((p) => {
      const inCart = draft.items.find((i) => i.productId === p.id);
      return '<button class="row ' + (inCart ? 'on' : '') + '" data-id="' + p.id + '"><div class="grow"><div class="title">' + esc(p.name) + '</div><div class="meta">' + (Number(p.stock) > 0 ? 'במלאי: ' + p.stock : 'אזל מהמלאי') + '</div></div><b class="num">' + moneyText(p.price) + '</b>' + icon(inCart ? 'check' : 'plus') + '</button>';
    }).join('') + '<button class="row" data-free><div class="grow"><div class="title">' + icon('plus') + ' פריט חופשי (לא מהמלאי)</div></div></button>';
  }

  function renderCart() {
    const box = m.$('#s_cart');
    if (!draft.items.length) { box.innerHTML = ''; }
    else box.innerHTML = '<div class="cart">' + draft.items.map((i, idx) =>
      '<div class="line"><div class="grow">' + (i.productId ? esc(i.name) : '<input class="input" data-name="' + idx + '" value="' + esc(i.name) + '" placeholder="תיאור הפריט" style="width:100%">') + '</div>' +
      '<div class="stepper"><button type="button" data-inc="' + idx + '">+</button><span class="q num">' + i.qty + '</span><button type="button" data-dec="' + idx + '">−</button></div>' +
      '<input class="input" type="number" inputmode="decimal" data-price="' + idx + '" value="' + i.price + '" aria-label="מחיר ליחידה">' +
      '<button class="icon-btn sm" type="button" data-rm="' + idx + '" aria-label="הסרה">' + icon('x') + '</button></div>').join('') + '</div>';
    m.$('#s_total').innerHTML = money(total());
  }
  const total = () => draft.items.reduce((s, i) => s + i.qty * (Number(i.price) || 0), 0);

  m.$('#s_psearch').addEventListener('input', renderProducts);
  m.$('#s_pres').addEventListener('click', (e) => {
    const b = e.target.closest('.row'); if (!b) return;
    if (b.hasAttribute('data-free')) draft.items.push({ productId: '', name: '', qty: 1, price: 0 });
    else {
      const p = productById(b.dataset.id);
      const ex = draft.items.find((i) => i.productId === p.id);
      if (ex) ex.qty++; else draft.items.push({ productId: p.id, name: p.name, qty: 1, price: Number(p.price) || 0 });
    }
    renderCart(); renderProducts();
    if (b.hasAttribute('data-free')) { const inp = m.$('[data-name="' + (draft.items.length - 1) + '"]'); if (inp) inp.focus(); }
  });
  m.$('#s_cart').addEventListener('click', (e) => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.inc) draft.items[t.dataset.inc].qty++;
    else if (t.dataset.dec) { const it = draft.items[t.dataset.dec]; it.qty = Math.max(1, it.qty - 1); }
    else if (t.dataset.rm) draft.items.splice(Number(t.dataset.rm), 1);
    else return;
    renderCart(); renderProducts();
  });
  m.$('#s_cart').addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset.price !== undefined) { draft.items[t.dataset.price].price = num(t.value); m.$('#s_total').innerHTML = money(total()); }
    if (t.dataset.name !== undefined) draft.items[t.dataset.name].name = t.value;
  });
  m.$('#s_receipt').addEventListener('change', (e) => {
    m.$('[data-save]').innerHTML = icon(e.target.checked ? 'receipt' : 'check') + (e.target.checked ? 'שמירה והפקת קבלה' : 'שמירת המכירה');
  });

  m.$('[data-save]').onclick = async () => {
    const items = draft.items.filter((i) => i.name.trim());
    if (!items.length) return toast('נא להוסיף לפחות מוצר אחד', { error: true });
    if (total() <= 0) return toast('הסכום לתשלום חייב להיות גדול מאפס', { error: true });
    const withReceipt = m.$('#s_receipt').checked;
    const btn = m.$('[data-save]');
    btn.disabled = true;
    try {
      let cust = draft.customer;
      if (draft.newCustomer && draft.newCustomer.name.trim()) {
        const r = await call('saveRecord', 'customers', { name: draft.newCustomer.name.trim(), phone: cleanPhone(draft.newCustomer.phone), type: 'customer', club: false });
        applyResult(r);
        cust = r.changes.customers[0];
      }
      const r = await call('createSale', {
        date: m.$('#s_date').value || todayIso(),
        customerId: cust ? cust.id : '', customerName: cust ? cust.name : '', customerPhone: cust ? cust.phone : '',
        items: items, payment: segValue(m.el, '#s_pay'), kind: 'sale', notes: m.$('#s_notes').value.trim(),
        withReceipt: withReceipt, followups: m.$('#s_fu').checked && !!cust,
      });
      applyResult(r);
      m.close();
      render();
      const sale = r.changes.sales[0];
      if (withReceipt) await finishReceipt(sale);
      else toast('המכירה נשמרה 🌿');
    } catch (e) {
      btn.disabled = false;
    }
  };

  renderCust(); renderProducts(); renderCart();
}

function newOtherIncome() {

      '<div class="field full"><label>אמצעי תשלום</label><div class="segmented" id="o_pay">' + PAYMENTS.concat(['אחר']).map((p, i) => '<button type="button" class="' + (i === 3 ? 'on' : '') + '" data-v="' + p + '">' + p + '</button>').join('') + '</div></div></div>' +
      '<label class="switch"><input type="checkbox" id="o_receipt"> הפקת קבלה</label>',

    onMount: (m) => bindSegmented(m.el),
  });

      date: m.$('#o_date').value || todayIso(), customerName: m.$('#o_from').value.trim(),

    });

    if (withReceipt) await finishReceipt(r.changes.sales[0]); else toast('ההכנסה נשמרה');
  };

async function buildReceiptPdf(sale) {
  await Promise.all([loadScript('html2canvas'), loadScript('jspdf')]);
  const stage = $('#receiptStage');
  stage.innerHTML = receiptHtml(sale);
  const el = stage.firstElementChild;
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  await Promise.all($$('img', el).map((img) => img.complete ? null : new Promise((r) => { img.onload = img.onerror = r; })));
  const canvas = await window.html2canvas(el, { scale: 2, backgroundColor: '#ffffff', logging: false, windowWidth: 900 });
  const pdf = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4', compress: true });
  const w = pdf.internal.pageSize.getWidth(), h = pdf.internal.pageSize.getHeight();
  pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, w, h);
  stage.innerHTML = '';
  return pdf.output('datauristring').split(',')[1];
}

async function finishReceipt(sale) {

    const r = await call('saveReceiptPdf', sale.id, b64, 'קבלה ' + receiptLabel(sale.receiptNo) + ' - ' + (sale.customerName || 'לקוח') + '.pdf');
    applyResult(r);
    current = r.changes.sales[0];
    render();
  } catch (e) {
    toast('הקבלה נשמרה, אבל קובץ ה־PDF לא נוצר. אפשר לנסות שוב מכרטיס המכירה.', { error: true });

const stockTimers = {};
function bumpStock(id, d) {
  const p = productById(id);
  if (!p) return;
  p.stock = (Number(p.stock) || 0) + d;
  p._pending = (p._pending || 0) + d;
  render();
  clearTimeout(stockTimers[id]);
  stockTimers[id] = setTimeout(async () => {
    const delta = p._pending; p._pending = 0;
    if (!delta) return;
    try { applyResult(await call('adjustStock', id, delta)); } catch (e) { p.stock -= delta; }
    render();
  }, 700);
}

async function importProducts() {
  const m = modal({
    title: 'ייבוא מלאי מקובץ',
    wide: true,
    body: '<p class="muted" style="margin-top:0">בחרי קובץ Excel או CSV של המלאי. בשלב הבא נתאים את העמודות. מוצרים קיימים (לפי מק״ט או שם) יתעדכנו.</p>' +
      '<label class="btn secondary" style="cursor:pointer">' + icon('upload') + 'בחירת קובץ<input type="file" id="imp_file" accept=".xlsx,.xls,.csv" hidden></label>' +
      '<div id="imp_map" style="margin-top:16px"></div>',
    foot: '<button class="btn" data-save disabled>' + icon('upload') + 'ייבוא</button><button class="btn secondary" data-close>ביטול</button>',
  });
  let rows = [], header = [];
  const FIELDS = [['name', 'שם מוצר', /שם|מוצר|name|product/i], ['code', 'מק״ט', /מק"?״?ט|קוד|code|sku|מספר/i], ['category', 'קטגוריה', /קטגור|סוג|category/i],
    ['stock', 'כמות במלאי', /כמות|מלאי|stock|qty|יש/i], ['price', 'מחיר ללקוח', /מחיר(?!.*עלות)|לקוח|price|מכירה/i], ['cost', 'מחיר עלות', /עלות|cost|קניה|רכישה/i], ['minStock', 'מינימום', /מינ|min/i]];
  m.$('#imp_file').addEventListener('change', async (e) => {
    const file = e.target.files[0]; if (!file) return;
    try {
      await loadScript('xlsx');
      const wb = window.XLSX.read(await file.arrayBuffer(), { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const all = window.XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' }).filter((r) => r.some((c) => String(c).trim()));
      let hi = all.findIndex((r) => r.filter((c) => String(c).trim()).length >= 2);
      if (hi < 0) hi = 0;
      header = all[hi].map((h, i) => String(h).trim() || 'עמודה ' + (i + 1));
      rows = all.slice(hi + 1);
      const used = {};
      const guess = (re) => { const i = header.findIndex((h, idx) => !used[idx] && re.test(h)); if (i >= 0) used[i] = 1; return i; };
      const guesses = FIELDS.map((f) => guess(f[2]));
      m.$('#imp_map').innerHTML = '<div class="form-grid">' + FIELDS.map((f, fi) => '<div class="field"><label>' + f[1] + '</label><select class="input" data-f="' + f[0] + '"><option value="-1">— לא לייבא —</option>' +
        header.map((h, i) => '<option value="' + i + '" ' + (guesses[fi] === i ? 'selected' : '') + '>' + esc(h) + '</option>').join('') + '</select></div>').join('') + '</div>' +
        '<div class="banner ok">' + icon('doc') + '<div>נמצאו <b>' + rows.length + '</b> שורות בקובץ ״' + esc(file.name) + '״</div></div>';
      m.$('[data-save]').disabled = false;
    } catch (err) {
      toast('לא הצלחתי לקרוא את הקובץ: ' + err.message, { error: true });
    }
  });
  m.$('[data-save]').onclick = async () => {
    const map = {};
    $$('#imp_map select', m.el).forEach((s) => { map[s.dataset.f] = Number(s.value); });
    if (map.name < 0) return toast('חובה לבחור את עמודת שם המוצר', { error: true });
    const out = rows.map((r) => {
      const o = {};
      Object.keys(map).forEach((k) => { if (map[k] >= 0) o[k] = ['stock', 'price', 'cost', 'minStock'].indexOf(k) >= 0 ? num(r[map[k]]) : String(r[map[k]]).trim(); });
      return o;
    }).filter((o) => o.name);
    const r = await mutate('importProducts', out);
    m.close();
    toast('יובאו ' + r.changes.products.length + ' מוצרים 🌿');
  };
}

      '<div class="field"><label for="rm_note">על מה</label><input class="input" id="rm_note" placeholder="למשל: לשאול על הקרם החדש" autofocus></div>',
    foot: '<button class="btn" data-save>' + icon('check') + 'שמירה</button><button class="btn secondary" data-close>ביטול</button>',
  });
  m.$('[data-save]').onclick = async () => {
    if (!cust) cust = customerById(m.$('#rm_c').value);
    if (!cust) return toast('נא לבחור איש קשר', { error: true });
    await saveRec('followups', { customerId: cust.id, customerName: cust.name, phone: cust.phone, type: cust.type === 'lead' ? 'lead' : 'custom', due: m.$('#rm_date').value || todayIso(), status: 'open', note: m.$('#rm_note').value.trim() });
    m.close(); toast('התזכורת נשמרה');
  };
}

/* =========================================================
   Club posts
   ========================================================= */
function postSkeleton(type, p) {
  const name = p ? p.name : '{מוצר}';
  const price = p && p.price ? moneyText(p.price) : '[מחיר]';
  if (type === 'new_product') return '✨ חדש אצלי: ' + name + ' ✨\n\nלמה אני מתלהבת ממנו:\n• \n• \n• \n\nמחיר: ' + price + '\nלהזמנה – שלחו לי הודעה פרטית 💚\n\nאלה בטבע 🌿';
  if (type === 'tip') return '🌿 הטיפ של אלה לשבוע\n\n[הטיפ במשפט או שניים]\n\n' + (p ? 'מוצר שיכול לעזור: ' + name + '\n\n' : '') + 'שאלות? אני כאן 💚';
  if (type === 'promo') return '🎁 הטבה לחברי המועדון בלבד\n\n[פרטי ההטבה]' + (p ? '\nעל ' + name + ' – ' + price : '') + '\n\nבתוקף עד: [תאריך]\nלהזמנה – הודעה פרטית 💚\n\nאלה בטבע 🌿';
  if (type === 'testimonial') return '💚 מה הלקוחות מספרים\n\n״[הציטוט]״\n– [שם]' + (p ? ', על ' + name : '') + '\n\nרוצים לשמוע עוד? כתבו לי 🌿';
  return '';
}
function editPost(post) {
  post = post || {};
  const isNew = !post.id;
  const type = post.type || 'new_product';
  const prods = activeProducts().slice().sort((a, b) => a.name.localeCompare(b.name, 'he'));
  const startProd = post.productId ? productById(post.productId) : null;
  const m = modal({
    title: isNew ? 'תוכן חדש למועדון' : 'עריכת תוכן',
    wide: true,
    body:
      '<div class="field"><label>סוג</label><div class="segmented" id="po_type">' + Object.keys(POST_TYPES).map((k) => '<button type="button" class="' + (type === k ? 'on' : '') + '" data-v="' + k + '">' + POST_TYPES[k].emo + ' ' + POST_TYPES[k].label + '</button>').join('') + '</div></div>' +
      '<div class="form-grid"><div class="field"><label for="po_prod">מוצר</label><select class="input" id="po_prod"><option value="">ללא מוצר</option>' + prods.map((p) => '<option value="' + p.id + '" ' + (post.productId === p.id ? 'selected' : '') + '>' + esc(p.name) + '</option>').join('') + '</select></div>' +
      '<div class="field"><label for="po_date">תאריך פרסום</label><input class="input" type="date" id="po_date" value="' + esc(post.date || todayIso()) + '"></div>' +
      '<div class="field full"><label for="po_title">כותרת (לשימוש פנימי)</label><input class="input" id="po_title" value="' + esc(post.title || (startProd ? startProd.name : '')) + '"></div></div>' +
      '<div class="field"><label for="po_body">ההודעה לקבוצה</label><textarea class="input" id="po_body" style="min-height:200px">' + esc(post.body || postSkeleton(type, startProd)) + '</textarea><span class="help">החליפי את הטקסט שבסוגריים המרובעים</span></div>' +
      '<div class="wa-preview"><div class="wa-bubble" id="po_prev"></div></div>',
    foot: '<button class="btn" data-save>' + icon('check') + 'שמירה</button><button class="btn wa" data-send>' + icon('wa') + 'שליחה לקבוצה</button><button class="btn secondary" data-copy>' + icon('copy') + 'העתקה</button>' + (!isNew ? '<button class="btn danger" data-del>' + icon('trash') + '</button>' : ''),
    onMount: (m) => bindSegmented(m.el),
  });
  const body = m.$('#po_body');
  const touched = { v: !!post.body };
  const prev = () => { m.$('#po_prev').textContent = body.value; };
  prev();
  body.addEventListener('input', () => { touched.v = true; prev(); });
  const regen = () => {
    if (touched.v && !confirm('להחליף את הטקסט בתבנית חדשה?')) return;
    const p = productById(m.$('#po_prod').value);
    body.value = postSkeleton(segValue(m.el, '#po_type'), p);
    if (p && !m.$('#po_title').value) m.$('#po_title').value = p.name;
    touched.v = false; prev();
  };
  m.$('#po_type').addEventListener('click', (e) => { if (e.target.closest('button')) setTimeout(regen, 0); });
  m.$('#po_prod').addEventListener('change', regen);
  const collect = (status) => Object.assign({}, post, {
    type: segValue(m.el, '#po_type'), productId: m.$('#po_prod').value, date: m.$('#po_date').value, title: m.$('#po_title').value.trim() || POST_TYPES[segValue(m.el, '#po_type')].label,
    body: body.value, status: status || (post.status && post.status !== 'draft' ? post.status : (m.$('#po_date').value > todayIso() ? 'planned' : 'draft')),
  });
  m.$('[data-save]').onclick = async () => {
    const rec = collect();
    if (rec.status === 'draft' && rec.date >= todayIso()) rec.status = 'planned';
    await saveRec('posts', rec); m.close(); toast('נשמר בתוכן המועדון');
  };
  m.$('[data-copy]').onclick = async () => { toast((await copyText(body.value)) ? 'הועתק – הדביקי בקבוצת המועדון' : 'ההעתקה נכשלה'); };
  m.$('[data-send]').onclick = async () => {
    openExternal(waLink('', body.value));
    await saveRec('posts', collect('sent'));
    m.close(); toast('סומן כנשלח 🌿');
  };
  const del = m.$('[data-del]');
  if (del) del.onclick = async () => {
    if (!(await confirmBox('מחיקת תוכן', 'למחוק את הפוסט?', 'מחיקה', true))) return;
    await delRec('posts', post.id); m.close();
  };
}

function editTemplate(t) {
  t = t || {};
  const m = modal({
    title: t.id ? 'עריכת נוסח' : 'נוסח חדש',
    body: '<div class="field"><label for="t_title">שם הנוסח</label><input class="input" id="t_title" value="' + esc(t.title) + '" autofocus></div>' +
      '<div class="field"><label for="t_cat">שימוש</label><select class="input" id="t_cat">' + Object.keys(TEMPLATE_CATS).map((k) => '<option value="' + k + '" ' + ((t.category || 'general') === k ? 'selected' : '') + '>' + TEMPLATE_CATS[k] + '</option>').join('') + '</select>' +
      '<span class="help">הנוסח הראשון בכל סוג (בדיקה / חידוש / קבלה) משמש אוטומטית בפולואפים ובשליחת קבלות</span></div>' +
      '<div class="field"><label for="t_text">הנוסח</label><textarea class="input" id="t_text" style="min-height:170px">' + esc(t.text) + '</textarea><span class="help">{שם} · {שם מלא} · {מוצרים} · {קבלה} · {קישור}</span></div>',
    foot: '<button class="btn" data-save>' + icon('check') + 'שמירה</button>' + (t.id ? '<button class="btn danger" data-del>' + icon('trash') + 'מחיקה</button>' : '') + '<button class="btn secondary" data-close>ביטול</button>',
  });
  m.$('[data-save]').onclick = async () => {
    const title = m.$('#t_title').value.trim(), text = m.$('#t_text').value.trim();
    if (!title || !text) return toast('נא למלא שם ונוסח', { error: true });
    await saveRec('templates', Object.assign({}, t, { title: title, text: text, category: m.$('#t_cat').value, order: t.order !== undefined ? t.order : D('templates').length }));
    m.close(); toast('הנוסח נשמר');
  };
  const del = m.$('[data-del]');
  if (del) del.onclick = async () => { if (await confirmBox('מחיקת נוסח', 'למחוק את הנוסח?', 'מחיקה', true)) { await delRec('templates', t.id); m.close(); } };
}

/* =========================================================
   Misc actions
   ========================================================= */
function exportCsv() {
  const y = String(state.year);
  const q = (v) => '"' + String(v === undefined || v === null ? '' : v).replace(/"/g, '""') + '"';
  const lines = [['סוג', 'תאריך', 'מספר קבלה', 'שם', 'תיאור', 'אמצעי תשלום', 'סכום', 'סטטוס'].map(q).join(',')];
  D('sales').filter((s) => s.date.slice(0, 4) === y).sort((a, b) => a.date.localeCompare(b.date)).forEach((s) => {
    lines.push(['הכנסה', fmtShort(s.date), receiptLabel(s.receiptNo), s.customerName, (s.items || []).map((i) => i.name + ' x' + i.qty).join('; '), s.payment, s.total, s.status === 'cancelled' ? 'בוטלה' : ''].map(q).join(','));
  });
  D('expenses').filter((x) => x.date.slice(0, 4) === y).sort((a, b) => a.date.localeCompare(b.date)).forEach((x) => {
    lines.push(['הוצאה', fmtShort(x.date), '', x.category, x.description, x.payment, x.amount, ''].map(q).join(','));
  });
  const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'אלה בטבע - הכנסות והוצאות ' + y + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  toast('הקובץ ירד למכשיר');
}

function moreMenu() {
  const items = NAV.filter((n) => BOTTOM.indexOf(n.id) === -1);
  const m = modal({
    title: 'עוד',
    body: '<div class="card list">' + items.map((n) => '<button class="row" data-go="' + n.id + '"><span class="avatar sm">' + icon(n.icon) + '</span><div class="grow"><div class="title">' + n.label + '</div></div>' + icon('chevL') + '</button>').join('') + '</div>',
  });
  m.el.addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) { m.close(); go(b.dataset.go); } });
}

/* =========================================================
   Action dispatcher
   ========================================================= */
const A = {
  go: (el) => go(el.dataset.view),
  tab: (el) => { state.tab[el.dataset.view] = el.dataset.tab; render(); },
  tabGo: (el) => { state.tab[el.dataset.view] = el.dataset.tab; go(el.dataset.view); },
  moreMenu: moreMenu,
  newSale: (el) => { closeAllModals(); newSale({ customerId: el.dataset.customer }); },
  newLead: () => editCustomer(null, true),
  newCustomer: () => editCustomer(null, false),
  openCustomer: (el) => openCustomer(el.dataset.id),
  quickMsg: (el, e) => { e.stopPropagation(); quickMessage({ customerId: el.dataset.customer, templateId: el.dataset.template }); },
  newExpense: () => editExpense(),
  editExpense: (el) => editExpense(D('expenses').find((x) => x.id === el.dataset.id)),
  newOtherIncome: newOtherIncome,
  openSale: (el) => openSale(el.dataset.id),
  newProduct: () => editProduct(),
  editProduct: (el) => editProduct(productById(el.dataset.id)),
  stock: (el) => bumpStock(el.dataset.id, Number(el.dataset.d)),
  receiveStock: receiveStock,
  copyMissing: copyMissing,
  importProducts: importProducts,
  newReminder: (el) => newReminder(el.dataset.customer),
  fuWa: (el) => {
    const f = D('followups').find((x) => x.id === el.dataset.id);
    const c = customerById(f.customerId);
    quickMessage({ customerId: f.customerId, text: followupText(f), products: f.products, onSent: () => {
      toast('ההודעה נשלחה ל' + firstName(c ? c.name : f.customerName) + '?', { action: 'סימון כבוצע', onAction: () => markFollowup(f, 'done').then(() => toast('מעולה 🌿')) });
    } });
  },
  fuDone: (el) => { const f = D('followups').find((x) => x.id === el.dataset.id); markFollowup(f, 'done').then(() => toast('סומן כבוצע 🌿')); },
  fuSnooze: (el) => {
    const f = D('followups').find((x) => x.id === el.dataset.id);
    const base = f.due > todayIso() ? f.due : todayIso();
    saveRec('followups', Object.assign({}, f, { due: addDays(base, 3) })).then(() => toast('נדחה ב־3 ימים'));
  },
  year: (el) => { state.year += Number(el.dataset.d); state.month = 'all'; render(); },
  exportCsv: exportCsv,
  openSheet: () => openExternal(state.data.meta.spreadsheetUrl),
  newPost: (el) => editPost({ type: el.dataset.type }),
  editPost: (el) => editPost(D('posts').find((p) => p.id === el.dataset.id)),
  copyPost: async (el) => { const p = D('posts').find((x) => x.id === el.dataset.id); toast((await copyText(p.body)) ? 'הועתק – הדביקי בקבוצה' : 'ההעתקה נכשלה'); },
  sendPost: async (el) => {
    const p = D('posts').find((x) => x.id === el.dataset.id);
    openExternal(waLink('', p.body));
    if (p.status !== 'sent') toast('נשלח לקבוצה?', { action: 'סימון כנשלח', onAction: () => saveRec('posts', Object.assign({}, p, { status: 'sent', date: todayIso() })) });
  },
  inviteClub: (el) => {
    const c = customerById(el.dataset.id);
    const t = templatesFor('club')[0];
    quickMessage({ customerId: c.id, text: fillTemplate(t ? t.text : 'היי {שם}, מוזמנת למועדון הלקוחות שלי 🌿 {קישור}', { name: c.name }), onSent: () => {
      toast('להוסיף את ' + firstName(c.name) + ' לחברי המועדון?', { action: 'כן', onAction: () => saveRec('customers', Object.assign({}, c, { club: true })) });
    } });
  },
  editTemplate: (el) => editTemplate(D('templates').find((t) => t.id === el.dataset.id)),
  copyTemplate: async (el) => { const t = D('templates').find((x) => x.id === el.dataset.id); toast((await copyText(t.text)) ? 'הנוסח הועתק' : 'ההעתקה נכשלה'); },
  saveSettings: async () => {
    const patch = {};
    $$('[data-setting]').forEach((i) => { patch[i.dataset.setting] = i.dataset.setting === 'phone' || i.dataset.setting === 'businessId' ? i.value.replace(/[^\d]/g, '') : i.value.trim(); });
    await mutate('saveSettings', patch);
    toast('ההגדרות נשמרו 🌿');
  },
  logout: () => window.__logout(),
  changeReceiptNo: () => {
    const m = modal({
      title: 'מספר הקבלה הבאה',
      body: '<div class="field"><label for="rn">מספר</label><input class="input" type="number" id="rn" value="' + esc(S().receiptNext) + '" autofocus><span class="help">אפשר רק להגדיל – למשל להמשיך מהמספר שבפנקס הקבלות הקודם.</span></div>',
      foot: '<button class="btn" data-save>שמירה</button><button class="btn secondary" data-close>ביטול</button>',
    });
    m.$('[data-save]').onclick = async () => { await mutate('setReceiptStart', num(m.$('#rn').value)); m.close(); toast('עודכן'); };
  },
};
function closeAllModals() { $$('#modalRoot .overlay').forEach((o) => o.remove()); }

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = A[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.input === 'search') { state.q[el.dataset.view] = el.value; render(); }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.input === 'month') { state.month = el.value; render(); }
});

/* =========================================================
   Boot
   ========================================================= */
function boot() {
  $('#splashLogo').src = LOGO_SRC;
  google.script.run
    .withSuccessHandler((data) => {
      state.data = unpackJson(data);
      $('#app').hidden = false;
      render();
      const sp = $('#splash');
      sp.style.opacity = '0';
      setTimeout(() => sp.remove(), 350);
    })
    .withFailureHandler((e) => {
      const sp = $('#splash');
      sp.classList.add('error');
      sp.innerHTML = '<img class="splash-logo" src="' + LOGO_SRC + '" alt="אלה בטבע"><b>לא הצלחתי לטעון את המערכת</b><div class="muted">' + esc((e && e.message) || e) + '</div><button class="btn" onclick="location.reload()">ניסיון נוסף</button>';
    })
    .rpc('bootstrap', '[]');
}
boot();
})();
</script>
