<title>מחכים לבייבי</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one-column phone app — soft header with countdown, content cards, fixed bottom tab bar, full-screen "birth mode" overlay */
:root {
  --bg: #f3f7fb;
  --surface: #ffffff;
  --surface2: #e8f0f8;
  --ink: #1f3550;
  --ink2: #5a6f88;
  --ink3: #93a3b6;
  --line: #d8e3ee;
  --sky: #6fa8dc;
  --sky-soft: #dcebf8;
  --peach: #f4a88c;
  --peach-soft: #fde9e1;
  --mint: #5bb59a;
  --mint-soft: #ddf2ea;
  --honey: #e9b54a;
  --honey-soft: #fbf0d6;
  --alert: #e0605a;
  --alert-soft: #fbe3e1;
  --shadow: 0 2px 10px rgba(31, 53, 80, .07);
  --display: "Varela Round", "Assistant", system-ui, sans-serif;
  --body: "Assistant", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111a28; --surface: #18243a; --surface2: #1f2d47; --ink: #e8eef7; --ink2: #a8b8cc; --ink3: #6b7f99;
    --line: #2a3a55; --sky: #8fbde8; --sky-soft: #22385a; --peach: #f6b39b; --peach-soft: #3d2b2a;
    --mint: #72c8ad; --mint-soft: #1d3b36; --honey: #f0c66a; --honey-soft: #3a3222; --alert: #f07a74; --alert-soft: #45262a;
    --shadow: 0 2px 12px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111a28; --surface: #18243a; --surface2: #1f2d47; --ink: #e8eef7; --ink2: #a8b8cc; --ink3: #6b7f99;
  --line: #2a3a55; --sky: #8fbde8; --sky-soft: #22385a; --peach: #f6b39b; --peach-soft: #3d2b2a;
  --mint: #72c8ad; --mint-soft: #1d3b36; --honey: #f0c66a; --honey-soft: #3a3222; --alert: #f07a74; --alert-soft: #45262a;
  --shadow: 0 2px 12px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
#app { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 400; text-wrap: balance; margin: 0; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
a { color: var(--sky); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 70px; }
label.f { display: grid; gap: 4px; font-size: .85rem; color: var(--ink2); font-weight: 600; }
.stack { display: grid; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--ink2); }
.small { font-size: .85rem; }
.tiny { font-size: .75rem; color: var(--ink3); }
.num { font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 4px 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font-size: 1.35rem; }
.sync { font-size: .72rem; padding: 3px 9px; border-radius: 99px; background: var(--surface2); color: var(--ink2); white-space: nowrap; }
.sync.on { background: var(--mint-soft); color: var(--mint); }
.iconbtn { border: 0; background: var(--surface2); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }

/* hero */
.hero { position: relative; overflow: hidden; border-radius: 26px; padding: 22px 20px 20px; background: linear-gradient(160deg, var(--sky-soft), var(--surface) 75%); border: 1px solid var(--line); }
.hero .clouds { position: absolute; inset: 0; pointer-events: none; opacity: .9; }
.hero .inner { position: relative; display: grid; gap: 6px; }
.hero .big { font-family: var(--display); font-size: 3.2rem; line-height: 1; color: var(--ink); }
.hero .big small { font-size: 1.1rem; color: var(--ink2); }
.weekbar { height: 10px; border-radius: 99px; background: var(--surface2); overflow: hidden; margin-top: 10px; }
.weekbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--sky), var(--mint)); border-radius: 99px; }
.weeklbl { display: flex; justify-content: space-between; font-size: .75rem; color: var(--ink3); margin-top: 4px; }

.birthbtn { width: 100%; border: 0; border-radius: 22px; padding: 18px; background: var(--alert); color: #fff; font-family: var(--display); font-size: 1.35rem; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 6px 18px rgba(224, 96, 90, .35); }
.birthbtn:active { transform: scale(.98); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.banner { border-radius: var(--r); padding: 14px 16px; display: grid; gap: 4px; }
.banner.honey { background: var(--honey-soft); }
.banner.peach { background: var(--peach-soft); }
.banner.mint { background: var(--mint-soft); }
.banner.sky { background: var(--sky-soft); }
.banner b { font-family: var(--display); font-weight: 400; font-size: 1.05rem; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 2px; }
.stat .v { font-family: var(--display); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.stat .l { font-size: .75rem; color: var(--ink2); }
.ring { height: 6px; border-radius: 99px; background: var(--surface2); overflow: hidden; margin-top: 6px; }
.ring i { display: block; height: 100%; background: var(--mint); }

/* section tabs inside a view */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; font-size: .9rem; font-weight: 600; color: var(--ink2); }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }

/* checklist */
.group { display: grid; gap: 8px; }
.ghead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-top: 6px; }
.ghead .cnt { font-size: .8rem; color: var(--ink3); font-variant-numeric: tabular-nums; }
.phase-now { font-size: .7rem; font-weight: 800; color: var(--sky); background: var(--sky-soft); border-radius: 99px; padding: 2px 8px; margin-inline-start: 6px; letter-spacing: .02em; }
.item { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.item.done { background: var(--surface2); border-color: transparent; }
.item.done .t { text-decoration: line-through; color: var(--ink3); }
.check { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--ink3); background: transparent; display: grid; place-items: center; margin-top: 1px; padding: 0; }
.done .check { background: var(--mint); border-color: var(--mint); }
.check svg { width: 14px; height: 14px; opacity: 0; }
.done .check svg { opacity: 1; }
.item .t { font-weight: 600; }
.item .d { font-size: .88rem; color: var(--ink2); margin-top: 2px; }
.xbtn { border: 0; background: none; color: var(--ink3); font-size: 1.1rem; padding: 2px 6px; }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; }
.btn { border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 700; background: var(--ink); color: var(--bg); white-space: nowrap; }
.btn.soft { background: var(--surface2); color: var(--ink); }
.btn.sky { background: var(--sky); color: #fff; }
.btn.small { padding: 6px 12px; font-size: .85rem; }

/* shopping */
.prod { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.prod.done { opacity: .75; }
.prod-h { display: flex; gap: 12px; align-items: flex-start; padding: 14px; }
.prod-h .main { flex: 1; min-width: 0; display: grid; gap: 4px; }
.prod-h .name { font-weight: 700; font-size: 1.02rem; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: .72rem; font-weight: 700; border-radius: 99px; padding: 2px 9px; background: var(--surface2); color: var(--ink2); }
.tag.must { background: var(--peach-soft); color: var(--alert); }
.tag.rec { background: var(--sky-soft); color: var(--sky); }
.tag.opt { background: var(--surface2); color: var(--ink2); }
.tag.used-ok { background: var(--mint-soft); color: var(--mint); }
.tag.used-no { background: var(--alert-soft); color: var(--alert); }
.tag.gift { background: var(--honey-soft); color: var(--honey); }
.price { font-family: var(--display); font-size: 1rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.expand { border: 0; background: none; color: var(--sky); font-weight: 700; padding: 0; font-size: .88rem; justify-self: start; }
.prod-b { border-top: 1px dashed var(--line); padding: 14px; display: grid; gap: 12px; background: var(--bg); }
.pick { display: grid; gap: 2px; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.pick .pn { font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pick .pt { font-size: .7rem; font-weight: 800; padding: 1px 8px; border-radius: 99px; background: var(--sky-soft); color: var(--sky); }
.pick .pt.prem { background: var(--honey-soft); color: var(--honey); }
.pick .pt.val { background: var(--mint-soft); color: var(--mint); }
.tip { font-size: .88rem; background: var(--honey-soft); border-radius: 12px; padding: 10px 12px; }
.quotes { display: grid; gap: 6px; }
.quote { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: .9rem; }
.quote.best { border-color: var(--mint); background: var(--mint-soft); }
.qform { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 6px; }

/* rights */
.right { display: grid; gap: 8px; }
.right .amt { font-family: var(--display); font-size: 1.6rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.right .who { font-size: .72rem; font-weight: 800; color: var(--sky); letter-spacing: .02em; }
.todo { display: flex; gap: 8px; align-items: flex-start; font-size: .9rem; background: var(--sky-soft); border-radius: 12px; padding: 10px 12px; }
.src { font-size: .78rem; color: var(--ink3); }
.src a { color: var(--ink2); }
.calc { display: grid; gap: 10px; }
.calc .res { font-family: var(--display); font-size: 1.5rem; font-variant-numeric: tabular-nums; }

/* expenses */
.bars { display: grid; gap: 10px; }
.bar { display: grid; gap: 4px; }
.bar .lbl { display: flex; justify-content: space-between; font-size: .88rem; }
.bar .track { height: 10px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.bar .track i { display: block; height: 100%; border-radius: 99px; background: var(--sky); }
.exp { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.exp:last-child { border-bottom: 0; }
.exp .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.eform { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.eform .full { grid-column: 1 / -1; }
.budget-meter { height: 14px; border-radius: 99px; background: var(--surface2); overflow: hidden; display: flex; }
.budget-meter i { display: block; height: 100%; }

/* bottom nav */
nav.tabs { position: fixed; inset: auto 0 0 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs .in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
nav.tabs button { border: 0; background: none; padding: 8px 2px 9px; display: grid; justify-items: center; gap: 2px; font-size: .7rem; font-weight: 700; color: var(--ink3); }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button.on { color: var(--sky); }

/* birth mode overlay */
.birth { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.birth .wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; display: grid; gap: 14px; }
.birth-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.timer { display: grid; justify-items: center; gap: 10px; padding: 22px 16px; border-radius: 26px; background: var(--surface); border: 1px solid var(--line); }
.timer .clock { font-family: var(--display); font-size: 3.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.cbtn { width: 170px; height: 170px; border-radius: 50%; border: 0; font-family: var(--display); font-size: 1.35rem; background: var(--sky); color: #fff; box-shadow: 0 8px 24px rgba(111, 168, 220, .4); }
.cbtn.live { background: var(--alert); box-shadow: 0 8px 24px rgba(224, 96, 90, .4); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.04); } }
@media (prefers-reduced-motion: reduce) { .cbtn.live { animation: none; } }
.clog { width: 100%; display: grid; gap: 4px; font-size: .9rem; }
.clog .r { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 6px 4px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.clog .r.h { font-size: .75rem; color: var(--ink3); font-weight: 700; }
.actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.act { border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 14px; display: grid; gap: 4px; text-decoration: none; color: var(--ink); text-align: start; }
.act b { font-family: var(--display); font-weight: 400; font-size: 1.05rem; }
.act span { font-size: .8rem; color: var(--ink2); }

.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-weight: 700; font-size: .9rem; max-width: calc(100% - 32px); }
.empty { text-align: center; padding: 24px 12px; color: var(--ink2); display: grid; gap: 6px; justify-items: center; }
details.more summary { cursor: pointer; font-weight: 700; color: var(--sky); }
@media (max-width: 420px) {
  .hero .big { font-size: 2.7rem; }
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .stat .v { font-size: 1.1rem; }
  .qform { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .qform .btn { grid-column: 1 / -1; }
}
</style>

<script>

  kzPreg: { t: "כל זכות — היריון ולידה", u: "https://www.kolzchut.org.il/he/הריון_ולידה" },
  kzTeach: { t: "כל זכות — גננות ועובדי הוראה", u: "https://www.kolzchut.org.il/he/גננות_ועובדי_הוראה" },

  kzPartner: { t: "כל זכות — דמי לידה לבן זוג של יולדת", u: "https://www.kolzchut.org.il/he/דמי_לידה_לבן_זוג_של_יולדת" },

const TASK_PHASES = [
  { id: "p1", title: "עכשיו · שבועות 27–30", from: 0, to: 30, items: [

    { id: "t-edu", t: "לברר עם משרד החינוך / ארגון המורים", d: "מתי לצאת לחופשת לידה, תשלום על חופשות (פסח וחופש גדול), משרת אם ומועד ההודעה על חל״ת." },
    { id: "t-uni", t: "לפנות לרכז ההתאמות באוניברסיטה", d: "לשאול מה מגיע לך כבן זוג של יולדת: היעדרות, מועד מבחן נוסף והגשות מאוחרות. כדאי לתכנן את סמסטר ב׳ מראש." },
    { id: "t-gift", t: "לשתף את המשפחה ברשימת המתנות", d: "בלשונית ׳קניות׳ אפשר לסמן מי קונה מה." },
    { id: "t-pump", t: "לבדוק בקופת החולים ובביטוח המשלים", d: "הטבות היריון ולידה: משאבת חלב, יועצת הנקה, קורסים וערכות." },
  ]},

/* ============================================================
   אחסון — משותף בין המכשירים (db) או מקומי כגיבוי
   ============================================================ */
const COLS = ["checks", "expenses", "quotes", "custom", "settings"];
const LS_KEY = "baby-app-v1";
const S = { mode: "local", db: null, data: { checks: {}, expenses: {}, quotes: {}, custom: {}, settings: {} }, readOnly: false };
function lsGet(k, f) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch (e) { return f; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
(function loadLocal() { const d = lsGet(LS_KEY, null); if (d) COLS.forEach(c => { S.data[c] = d[c] || {}; }); })();
function saveLocal() { if (S.mode === "local") lsSet(LS_KEY, S.data); }

async function put(col, id, obj) {
  if (S.readOnly) { toast("אין לך הרשאת עריכה בעמוד הזה"); return; }
  if (S.mode === "db") {
    S.data[col] = { ...S.data[col], [id]: obj }; render();
    try { await S.db.collection(col).doc(id).set(obj); }
    catch (e) { handleWriteError(e); }
  } else { S.data[col] = { ...S.data[col], [id]: obj }; saveLocal(); render(); }
}
async function del(col, id) {
  if (S.readOnly) { toast("אין לך הרשאת עריכה בעמוד הזה"); return; }
  const next = { ...S.data[col] }; delete next[id]; S.data[col] = next;

}

async function initDb() {

    const db = await window.claude.use("db");
    if (!db) return;
    S.db = db; S.mode = "db";
    COLS.forEach(c => {

        const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); });
        S.data[c] = m; scheduleRender();

}

  return `<div class="stack"><h2>תיק לידה</h2>
  <p class="muted small">לארוז עד שבוע 36 ולהשאיר ליד הדלת. הלידה צפויה בחורף, אז כדאי שכבות ובגדים חמים.</p>
  <div class="chips">${BAG.map(x => { const ids = x.items.map(i => i[0]).concat(customOf("bag-" + x.id).map(c => c.id)); return `<button class="chip ${x.id === b.id ? "on" : ""}" data-bagtab="${x.id}">${esc(x.title)} <span class="num">${ids.filter(isDone).length}/${ids.length}</span></button>`; }).join("")}</div>
  <div class="group">${items.map(taskRow).join("")}</div>
  <form class="addrow" data-addcustom="bag-${b.id}"><input id="add-bag" name="text" placeholder="להוסיף פריט…" autocomplete="off"><button class="btn" type="submit">הוספה</button></form>
  </div>`;
}

/* ---------- זכויות ---------- */
function vRights() {
  return `<div class="stack"><h2>הזכויות שלכם</h2>
  <p class="muted small">זכויות בישראל לפי המצב שלכם: אשתך שכירה במשרד החינוך, ואתה סטודנט. הסכומים הם של 2026 ומתעדכנים בכל ינואר, ולכן לפני הגשה כדאי לבדוק באתר ביטוח לאומי. אפשר לסמן כל זכות אחרי שטיפלתם בה.</p>
  ${RIGHTS.map(r => { const done = isDone(r.id); return `<article class="card right" style="${done ? "opacity:.7" : ""}">
    <div class="row" style="justify-content:space-between;align-items:flex-start"><div class="grow"><div class="who">${esc(r.who)}</div><h3>${esc(r.title)}</h3></div><div class="amt">${esc(r.amt)}</div></div>
    <p class="small">${esc(r.body)}</p>
    <div class="todo ${done ? "done" : ""}"><button class="check" data-toggle="${r.id}" aria-label="סמן שטופל" aria-pressed="${done}">${IC.check}</button><span><b>מה עושים:</b> ${esc(r.todo)}</span></div>
    ${r.calc ? matCalc() : ""}
    <div class="src">מקור: ${r.src.map(k => `<a href="${SRC[k].u}" target="_blank" rel="noopener">${esc(SRC[k].t)}</a>`).join(" · ")}</div>
  </article>`; }).join("")}
  <div class="banner peach"><b>טיפ</b><span class="small">כל זכות אוטומטית שמגיעה לחשבון אפשר לרשום גם בלשונית ההוצאות כהכנסה, כדי לראות את התמונה המלאה.</span></div>
  </div>`;
}
function matCalc() {
  const sal = +(lsGet("baby-sal", 0)) || "";
  return `<div class="calc card flat" style="background:var(--surface2);border:0"><b class="small">מחשבון דמי לידה (ברוטו, הערכה)</b>
  <label class="f">השכר הברוטו הממוצע בחודש<input id="sal" type="number" inputmode="decimal" min="0" placeholder="למשל 11000" value="${sal}" data-sal="1"></label>
  <div id="calcres">${calcText(sal)}</div></div>`;
}
function calcText(sal) {
  if (!sal) return '<span class="tiny">הכניסו שכר כדי לראות הערכה.</span>';
  const daily = Math.min(1752.33, (sal * 3) / 90); const total = daily * 105;
  return `<div class="res">${ils(total)}</div><span class="tiny">${ils(daily)} ליום × 105 ימים. ההערכה לפני ניכוי מס, ביטוח לאומי ומס בריאות.</span>`;
}

/* ---------- הוצאות ---------- */
function vMoney() {
  const st = settings(); const ex = Object.entries(S.data.expenses).map(([id, e]) => ({ id, ...e })).sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.at || 0) - (a.at || 0));
  const spent = ex.filter(e => !e.income).reduce((s, e) => s + (+e.amount || 0), 0);
  const income = ex.filter(e => e.income).reduce((s, e) => s + (+e.amount || 0), 0);
  const byCat = EXP_CATS.map(c => ({ ...c, sum: ex.filter(e => !e.income && e.cat === c.id).reduce((s, e) => s + (+e.amount || 0), 0) })).filter(c => c.sum > 0);
  const max = Math.max(1, ...byCat.map(c => c.sum));
  const today = new Date().toISOString().slice(0, 10);
  return `<div class="stack"><h2>הוצאות ותקציב</h2>
  <div class="stats">
    <div class="stat"><span class="v">${ils(spent)}</span><span class="l">הוצאנו</span></div>
    <div class="stat"><span class="v" style="color:${st.budget - spent < 0 ? "var(--alert)" : "var(--mint)"}">${ils(st.budget - spent)}</span><span class="l">נשאר מהתקציב</span></div>
    <div class="stat"><span class="v">${ils(income)}</span><span class="l">התקבל (מענקים, מתנות)</span></div>
  </div>
  <div class="budget-meter" aria-label="ניצול תקציב">${byCat.map(c => `<i style="width:${c.sum / Math.max(st.budget, spent) * 100}%;background:${c.c}"></i>`).join("")}</div>
  <p class="tiny">תקציב: ${ils(st.budget)} · אפשר לשנות בהגדרות</p>

  <form class="card eform" data-addexp="1">
    <h3 class="full">רישום הוצאה</h3>
    <label class="f full">מה קנינו<input id="e-name" name="name" required placeholder="עגלת Joolz Day+" autocomplete="off"></label>
    <label class="f">סכום ₪<input id="e-amount" name="amount" type="number" inputmode="decimal" min="0" required></label>
    <label class="f">תאריך<input id="e-date" name="date" type="date" value="${today}"></label>
    <label class="f">קטגוריה<select id="e-cat" name="cat">${EXP_CATS.map(c => `<option value="${c.id}">${c.n}</option>`).join("")}</select></label>
    <label class="f">איפה<input id="e-store" name="store" placeholder="חנות / אתר" autocomplete="off"></label>
    <label class="f full" style="display:flex;gap:8px;align-items:center;flex-direction:row"><input id="e-income" name="income" type="checkbox" style="width:auto"> זו הכנסה (מענק, מתנה כספית)</label>
    <button class="btn full" type="submit">שמירה</button>
  </form>

  ${byCat.length ? `<section class="card stack"><h3>לפי קטגוריה</h3><div class="bars">${byCat.sort((a, b) => b.sum - a.sum).map(c => `<div class="bar"><div class="lbl"><span>${c.n}</span><b class="num">${ils(c.sum)}</b></div><div class="track"><i style="width:${c.sum / max * 100}%;background:${c.c}"></i></div></div>`).join("")}</div></section>` : ""}

  <section class="card"><h3 style="margin-bottom:6px">כל הרשומות</h3>
  ${ex.length ? ex.map(e => { const c = EXP_CATS.find(x => x.id === e.cat) || EXP_CATS[7]; return `<div class="exp"><span class="dot" style="background:${e.income ? "var(--mint)" : c.c}"></span><div class="grow"><div style="font-weight:600">${esc(e.name)}</div><div class="tiny">${e.date ? fmtDate(e.date) : ""}${e.store ? " · " + esc(e.store) : ""} · ${e.income ? "הכנסה" : c.n}</div></div><b class="num" style="color:${e.income ? "var(--mint)" : "var(--ink)"}">${e.income ? "+" : ""}${ils(e.amount)}</b><button class="xbtn" data-delexp="${e.id}" aria-label="מחק">×</button></div>`; }).join("") : `<div class="empty"><b>עוד לא נרשמו הוצאות</b><span class="small">רשמו כאן את הקנייה הראשונה, או לחצו ׳קנינו׳ על מחיר ששמרתם ברשימת הקניות.</span></div>`}
  </section></div>`;
}

/* ---------- הגדרות ---------- */
function vSettings() {
  const st = settings();
  return `<div class="stack"><div class="row"><button class="btn soft small" data-go="home">→ חזרה</button><h2>הגדרות</h2></div>
  <form class="card stack" data-settings="1">
    <label class="f">תאריך לידה משוער<input id="st-due" name="due" type="date" value="${esc(st.due)}"></label>
    <label class="f">תקציב לציוד (₪)<input id="st-budget" name="budget" type="number" min="0" value="${esc(st.budget)}"></label>
    <label class="f">טלפון חדר לידה / מיון יולדות בשמיר<input id="st-phone" name="phone" type="tel" value="${esc(st.phone)}" placeholder="לבדוק באתר בית החולים ולשמור כאן"></label>
    <label class="f">טלפון המוהל<input id="st-mohel" name="mohel" type="tel" value="${esc(st.mohel)}"></label>
    <label class="f">את מי לעדכן כשמתחילים (שורה לכל אחד)<textarea id="st-notify" name="notify">${esc(st.notify)}</textarea></label>
    <button class="btn" type="submit">שמירה</button>
  </form>
  <div class="card flat small muted stack"><b style="color:var(--ink)">שיתוף עם אשתך</b><span>${S.mode === "db" ? "השינויים נשמרים בענן ומתעדכנים אצל כל מי שקיבל הרשאת עריכה. כדי לשתף, לחצו על Share בעמוד ותנו לאשתך הרשאת עריכה (Editor) לפי המייל שלה." : "כרגע הנתונים נשמרים רק במכשיר הזה. כשפותחים את האפליקציה דרך claude.ai, הנתונים מסונכרנים בין המכשירים."}</span>
  <a href="${SRC.shamir.u}" target="_blank" rel="noopener">אתר המרכז הרפואי שמיר ↗</a></div>
  </div>`;
}

/* ============================================================
   מצב לידה — טיימר צירים
   ============================================================ */
const BIRTH = lsGet("baby-contractions", { list: [], cur: null });
function saveBirth() { lsSet("baby-contractions", BIRTH); }
let tick;
function openBirth() { $("#birth").hidden = false; document.body.style.overflow = "hidden"; renderBirth(); clearInterval(tick); tick = setInterval(updClock, 500); }
function closeBirth() { $("#birth").hidden = true; document.body.style.overflow = ""; clearInterval(tick); }
const mmss = ms => { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function updClock() {
  const el = $("#clock"); if (!el) return;
  if (BIRTH.cur) el.textContent = mmss(Date.now() - BIRTH.cur);
  else { const last = BIRTH.list[BIRTH.list.length - 1]; el.textContent = last ? mmss(Date.now() - last.e) : "0:00"; }
}
function analysis() {
  const L = BIRTH.list.slice(-8); if (L.length < 3) return null;
  const ints = []; for (let k = 1; k < L.length; k++) ints.push(L[k].s - L[k - 1].s);
  const avgI = ints.reduce((a, b) => a + b, 0) / ints.length; const avgD = L.reduce((a, c) => a + (c.e - c.s), 0) / L.length;
  return { avgI, avgD, ready: avgI <= 5.5 * 60e3 && avgD >= 45e3 };
}
function renderBirth() {
  const st = settings(); const L = BIRTH.list; const an = analysis();
  const rows = L.slice(-10).reverse().map((c, k, arr) => { const prev = arr[k + 1]; return `<div class="r"><span>${new Date(c.s).toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" })}</span><span>${mmss(c.e - c.s)}</span><span>${prev ? mmss(c.s - prev.s) : "—"}</span></div>`; }).join("");
  const waze = "https://waze.com/ul?q=" + encodeURIComponent("המרכז הרפואי שמיר אסף הרופא") + "&navigate=yes";
  $("#birth").innerHTML = `<div class="wrap">
  <div class="birth-h"><h2>מצב לידה 💛</h2><button class="btn soft" data-closebirth="1">סגירה</button></div>
  <div class="banner peach"><b>נושמים. אתם מוכנים לזה.</b><span class="small">לנסוע מיד לבית החולים אם: ירדו מים, יש דימום, יש ירידה בתנועות התינוק, או כאב חזק ומתמשך. בכל מקרה של ספק, להתקשר לחדר הלידה.</span></div>
  <section class="timer"><span class="muted small">${BIRTH.cur ? "ציר עכשיו" : "מאז הציר האחרון"}</span><div class="clock" id="clock">0:00</div>
    <button class="cbtn ${BIRTH.cur ? "live" : ""}" data-contraction="1">${BIRTH.cur ? "הציר נגמר" : "התחיל ציר"}</button>
    ${an ? `<div class="banner ${an.ready ? "peach" : "sky"}" style="width:100%"><b>${an.ready ? "הצירים סדירים וצפופים. זה הזמן להתקשר לחדר הלידה" : "ממשיכים לעקוב"}</b><span class="small">ממוצע: ציר כל ${mmss(an.avgI)} דק׳, באורך ${mmss(an.avgD)}. בלידה ראשונה הכלל המקובל לנסיעה הוא ציר כל 5 דקות, באורך דקה, במשך שעה (5-1-1), אלא אם הצוות אמר אחרת.</span></div>` : `<span class="tiny">לוחצים כשציר מתחיל ושוב כשהוא נגמר. אחרי 3 צירים יופיע ניתוח.</span>`}
    ${L.length ? `<div class="clog"><div class="r h"><span>שעה</span><span>אורך</span><span>מרווח</span></div>${rows}</div><button class="btn soft small" data-resetc="1">${resetArm ? "ללחוץ שוב כדי לאשר מחיקה" : "איפוס הרשימה"}</button>` : ""}
  </section>
  <div class="actions">
    <a class="act" href="${waze}" target="_blank" rel="noopener"><b>ניווט לשמיר ↗</b><span>Waze · צריפין, באר יעקב</span></a>
    <div class="act"><b>חדר לידה</b><span class="num" style="user-select:all">${st.phone ? `<a href="tel:${esc(st.phone)}">${esc(st.phone)}</a>` : 'להוסיף מספר <button class="expand" data-go-settings="1">בהגדרות</button>'}</span></div>
  </div>
  <section class="card stack"><h3>לפני שיוצאים מהבית</h3>
    ${["x-bag|תיק לידה", "x-docs|תיקיית מסמכים ותעודות זהות", "x-charge|מטענים וטלפונים", "x-seat|הסלקל מותקן ברכב", "x-home|לנעול, לכבות גז ולהשאיר אוכל לחיות"].map(s => { const [id, t] = s.split("|"); return taskRow({ id, t }); }).join("")}
  </section>
  <section class="card stack"><h3>את מי לעדכן</h3>
    ${st.notify.split("\n").map(n => n.trim()).filter(Boolean).map((n, k) => taskRow({ id: "n-" + k, t: n })).join("") || '<span class="tiny">אפשר להוסיף אנשים בהגדרות.</span>'}
  </section>
  </div>`;
  updClock();
}
let resetArm = false;

/* ============================================================
   אירועים
   ============================================================ */
document.addEventListener("click", e => {
  const t = e.target.closest("button, a"); if (!t) return;
  const d = t.dataset;
  if (d.go) { go(d.go); return; }
  if (d.goSettings) { closeBirth(); go("settings"); return; }
  if (d.toggle) { toggle(d.toggle); return; }
  if (d.open) { UI.open[d.open] = !UI.open[d.open]; saveUI(); render(); return; }
  if (d.shopcat) { UI.shopCat = d.shopcat; saveUI(); render(); return; }
  if (d.bagtab) { UI.bagTab = d.bagtab; saveUI(); render(); return; }
  if (d.delcustom) { del("custom", d.delcustom); return; }
  if (d.delquote) { del("quotes", d.delquote); return; }
  if (d.delexp) { del("expenses", d.delexp); return; }
  if (d.buyquote) {
    const q = S.data.quotes[d.buyquote]; if (!q) return;
    const it = allShopItems().find(i => i.id === q.item); const cat = SHOP.find(c => c.items.includes(it));
    put("expenses", newId(), { name: it ? it.name : q.store, amount: q.price, store: q.store, cat: cat ? cat.id : "other", date: new Date().toISOString().slice(0, 10), at: Date.now() });
    if (it && !isDone(it.id)) put("checks", it.id, { done: true, at: Date.now() });
    toast("נרשם בהוצאות וסומן כנקנה ✓"); return;
  }
  if (d.birth) { openBirth(); return; }
  if (d.closebirth) { closeBirth(); render(); return; }
  if (d.contraction) {
    if (BIRTH.cur) { BIRTH.list.push({ s: BIRTH.cur, e: Date.now() }); BIRTH.cur = null; } else BIRTH.cur = Date.now();
    saveBirth(); renderBirth(); return;
  }
  if (d.resetc) { if (resetArm) { BIRTH.list = []; BIRTH.cur = null; saveBirth(); resetArm = false; } else { resetArm = true; setTimeout(() => { resetArm = false; if (!$("#birth").hidden) renderBirth(); }, 4000); } renderBirth(); return; }
});
document.addEventListener("submit", e => {
  const f = e.target; e.preventDefault(); const d = f.dataset; const fd = new FormData(f);
  if (d.addcustom) { const text = (fd.get("text") || "").trim(); if (!text) return; f.reset(); document.activeElement && document.activeElement.blur(); put("custom", newId(), { list: d.addcustom, text, at: Date.now() }); return; }
  if (d.addquote) { const store = (fd.get("store") || "").trim(); const price = +fd.get("price"); if (!store || !(price >= 0)) return; f.reset(); document.activeElement.blur(); put("quotes", newId(), { item: d.addquote, store, price, at: Date.now() }); toast("המחיר נשמר"); return; }
  if (d.gift) { const by = (fd.get("by") || "").trim(); document.activeElement.blur(); if (by) put("checks", "gift-" + d.gift, { by, at: Date.now() }); else del("checks", "gift-" + d.gift); toast(by ? "נרשם כמתנה 🎁" : "הוסר"); return; }
  if (d.addexp) {
    const name = (fd.get("name") || "").trim(); const amount = +fd.get("amount"); if (!name || !(amount >= 0)) return;
    const obj = { name, amount, date: fd.get("date") || "", cat: fd.get("cat"), store: (fd.get("store") || "").trim(), income: !!fd.get("income"), at: Date.now() };
    f.reset(); document.activeElement.blur(); put("expenses", newId(), obj); toast("נשמר ✓"); return;
  }
  if (d.settings) {
    const obj = { due: fd.get("due") || defaultDue(), budget: +fd.get("budget") || 0, phone: (fd.get("phone") || "").trim(), mohel: (fd.get("mohel") || "").trim(), notify: fd.get("notify") || "" };
    document.activeElement.blur(); put("settings", "main", obj); toast("ההגדרות נשמרו"); return;
  }
});
document.addEventListener("input", e => {
  if (e.target.dataset && e.target.dataset.sal) { const v = +e.target.value || 0; lsSet("baby-sal", v); const r = $("#calcres"); if (r) r.innerHTML = calcText(v); }
});

render();
initDb();
</script>
