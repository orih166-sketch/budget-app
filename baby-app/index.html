<title>מחכים לבייבי</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: phone-first single column — night-sky hero with the week's "size" moon, one focused task, upcoming dates; 5-tab bottom bar; birth mode as a calm full-screen sheet with three huge actions */
:root {
  --bg: #eef2fb;
  --surface: #ffffff;
  --surface2: #e5ebf8;
  --ink: #1b2440;
  --ink2: #48557a;
  --ink3: #7f8bab;
  --line: #d5dcef;
  --accent: #5b7fd6;
  --accent-soft: #dde5fa;
  --moon: #d99a22;
  --moon-soft: #fbefd6;
  --coral: #dd5a52;
  --coral-soft: #fbe1de;
  --mint: #2f9a7e;
  --mint-soft: #d6efe7;
  --sky1: #c3d1f5;
  --sky2: #eef2fb;
  --star: #ffffff;
  --shadow: 0 1px 2px rgba(27, 36, 64, .05), 0 6px 20px rgba(27, 36, 64, .06);
  --display: "Varela Round", "Rubik", system-ui, sans-serif;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --r: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1430; --surface: #171f40; --surface2: #202a50; --ink: #eef1fb; --ink2: #b9c2dd; --ink3: #7c88ad; --line: #2a3563;
    --accent: #95aef2; --accent-soft: #26325f; --moon: #f3c766; --moon-soft: #3a3322; --coral: #f3837b; --coral-soft: #47262d;
    --mint: #6fd0b2; --mint-soft: #193a3a; --sky1: #1e2a5c; --sky2: #0e1430; --star: #f8e9b8; --shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1430; --surface: #171f40; --surface2: #202a50; --ink: #eef1fb; --ink2: #b9c2dd; --ink3: #7c88ad; --line: #2a3563;
  --accent: #95aef2; --accent-soft: #26325f; --moon: #f3c766; --moon-soft: #3a3322; --coral: #f3837b; --coral-soft: #47262d;
  --mint: #6fd0b2; --mint-soft: #193a3a; --sky1: #1e2a5c; --sky2: #0e1430; --star: #f8e9b8; --shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); overscroll-behavior-y: none; }
body { color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
#app { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px calc(100px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 400; text-wrap: balance; margin: 0; letter-spacing: -.005em; }
h2 { font-size: 1.6rem; line-height: 1.25; }
h3 { font-size: 1.15rem; line-height: 1.3; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
button, .press { transition: transform 160ms var(--ease-out), background-color 200ms ease, opacity 200ms ease; }
button:active, .press:active { transform: scale(.97); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
input, select, textarea { font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 11px 13px; width: 100%; min-width: 0; transition: border-color 150ms ease; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; }
textarea { resize: vertical; min-height: 80px; }
label.f { display: grid; gap: 5px; font-size: .85rem; color: var(--ink2); font-weight: 500; }
.hint { font-size: .78rem; color: var(--ink3); font-weight: 400; }
.stack { display: grid; gap: 16px; }
.stack-s { display: grid; gap: 8px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--ink2); }
.small { font-size: .88rem; }
.tiny { font-size: .78rem; color: var(--ink3); }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: .74rem; font-weight: 700; letter-spacing: .04em; color: var(--ink3); }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 2px 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 { font-size: 1.2rem; }
.sync { font-size: .7rem; color: var(--ink3); display: flex; align-items: center; gap: 5px; }
.sync::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink3); }
.sync.on::before { background: var(--mint); }
.topbtns { display: flex; gap: 8px; align-items: center; }
.iconbtn { border: 0; background: var(--surface2); width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: var(--ink2); }
.pill-birth { border: 0; background: var(--coral-soft); color: var(--coral); border-radius: 99px; padding: 9px 14px; font-weight: 700; font-size: .85rem; display: flex; gap: 6px; align-items: center; }

/* hero */
.hero { position: relative; overflow: hidden; border-radius: 28px; background: linear-gradient(175deg, var(--sky1), var(--sky2) 92%); padding: 22px 20px 20px; isolation: isolate; }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.hero .hello { font-size: .92rem; color: var(--ink2); }
.hero .wk { font-family: var(--display); font-size: 2.6rem; line-height: 1.05; }
.hero .wk small { font-size: 1.05rem; color: var(--ink2); }
.hero .left { font-size: .95rem; color: var(--ink2); margin-top: 4px; }
.moonball { width: 112px; height: 112px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--surface), var(--moon-soft) 70%); display: grid; place-items: center; box-shadow: 0 0 0 8px color-mix(in srgb, var(--moon) 14%, transparent), 0 10px 30px color-mix(in srgb, var(--moon) 30%, transparent); }
.moonball span { font-size: 3.4rem; line-height: 1; }
.size-txt { margin-top: 12px; font-size: .95rem; }
.size-txt b { font-weight: 700; }
.track { position: relative; height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--ink) 10%, transparent); margin-top: 16px; }
.track > i { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 99px; background: linear-gradient(to left, var(--moon), var(--accent)); }
.marks { position: relative; height: 18px; margin-top: 4px; font-size: .7rem; color: var(--ink3); }
.marks span { position: absolute; transform: translateX(50%); white-space: nowrap; }

.birth-big { width: 100%; border: 0; border-radius: 24px; padding: 20px; background: var(--coral); color: #fff; font-family: var(--display); font-size: 1.4rem; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 8px 22px color-mix(in srgb, var(--coral) 40%, transparent); }

.card { background: var(--surface); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
.focus { background: var(--surface); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); display: grid; gap: 12px; }
.focus .big { font-family: var(--display); font-size: 1.3rem; line-height: 1.35; }
.focus .bar { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 14px; padding: 11px 18px; font-weight: 700; background: var(--ink); color: var(--bg); white-space: nowrap; }
.btn.soft { background: var(--surface2); color: var(--ink); }
.btn.accent { background: var(--accent); color: #fff; }
.btn.mint { background: var(--mint); color: #fff; }
.btn.small { padding: 7px 13px; font-size: .85rem; border-radius: 11px; }
.link { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 0; font-size: .9rem; }

.upcoming { display: grid; gap: 0; }
.up { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.up:last-child { border-bottom: 0; }
.cal { border-radius: 14px; background: var(--accent-soft); text-align: center; padding: 6px 0 5px; line-height: 1.1; }
.cal b { display: block; font-family: var(--display); font-size: 1.3rem; font-weight: 400; color: var(--ink); }
.cal span { font-size: .68rem; color: var(--ink2); }
.up.hot .cal { background: var(--moon-soft); }
.up .t { font-weight: 500; }
.up .d { font-size: .8rem; color: var(--ink3); }

.progress3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.pg { border: 0; background: var(--surface); border-radius: 18px; padding: 14px 12px; box-shadow: var(--shadow); text-align: start; display: grid; gap: 6px; }
.pg .v { font-family: var(--display); font-size: 1.35rem; font-variant-numeric: tabular-nums; line-height: 1; }
.pg .l { font-size: .76rem; color: var(--ink2); }
.mini { height: 5px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.mini i { display: block; height: 100%; background: var(--mint); border-radius: 99px; }

/* segmented + chips */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface2); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; border-radius: 11px; padding: 9px 6px; font-weight: 700; font-size: .9rem; color: var(--ink2); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; overscroll-behavior-x: contain; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 99px; padding: 8px 15px; font-size: .88rem; font-weight: 500; color: var(--ink2); }
.chip.on { background: var(--ink); color: var(--bg); }
.chip .num { opacity: .7; margin-inline-start: 4px; }

/* checklist */
.group { display: grid; gap: 8px; }
.ghead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-top: 10px; }
.ghead .cnt { font-size: .8rem; color: var(--ink3); font-variant-numeric: tabular-nums; }
.now { font-size: .68rem; font-weight: 700; color: var(--moon); background: var(--moon-soft); border-radius: 99px; padding: 2px 9px; margin-inline-start: 8px; vertical-align: middle; }
.item { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border-radius: 16px; padding: 13px 14px; box-shadow: var(--shadow); }
.item.done { background: transparent; box-shadow: none; padding-block: 8px; }
.item.done .t { text-decoration: line-through; text-decoration-color: var(--ink3); color: var(--ink3); }
.item.done .d { display: none; }
.check { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--ink3); background: transparent; display: grid; place-items: center; padding: 0; }
.check svg { width: 15px; height: 15px; opacity: 0; transform: scale(.6); transition: opacity 150ms ease, transform 220ms var(--ease-out); }
.done .check { background: var(--mint); border-color: var(--mint); }
.done .check svg { opacity: 1; transform: scale(1); }
.item .t { font-weight: 500; }
.item .d { font-size: .88rem; color: var(--ink2); margin-top: 2px; }
.xbtn { border: 0; background: none; color: var(--ink3); font-size: 1.2rem; padding: 0 6px; line-height: 1; }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; }

/* products */
.prod { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.prod-h { display: flex; gap: 12px; align-items: flex-start; padding: 15px; }
.prod-h .main { flex: 1; min-width: 0; display: grid; gap: 6px; }
.prod .name { font-weight: 700; font-size: 1rem; line-height: 1.35; }
.prod.done .name { color: var(--ink3); }
.ours { font-size: .82rem; color: var(--accent); font-weight: 500; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: .7rem; font-weight: 700; border-radius: 99px; padding: 2px 9px; background: var(--surface2); color: var(--ink2); }
.tag.must { background: var(--coral-soft); color: var(--coral); }
.tag.rec { background: var(--accent-soft); color: var(--accent); }
.tag.ok { background: var(--mint-soft); color: var(--mint); }
.tag.no { background: var(--coral-soft); color: var(--coral); }
.tag.gift { background: var(--moon-soft); color: var(--moon); }
.price { font-family: var(--display); font-size: 1.05rem; white-space: nowrap; font-variant-numeric: tabular-nums; text-align: end; }
.prod-b { padding: 4px 15px 16px; display: grid; gap: 14px; }
.picks { display: grid; gap: 8px; }
.pick { border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 11px 13px; display: grid; gap: 3px; text-align: start; width: 100%; }
.pick.on { border-color: var(--accent); background: var(--accent-soft); }
.pick .pn { font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pick .pt { font-size: .66rem; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--mint-soft); color: var(--mint); }
.pick .pt.prem { background: var(--moon-soft); color: var(--moon); }
.pick .ourmark { font-size: .7rem; font-weight: 700; color: var(--accent); margin-inline-start: auto; }
.tip { font-size: .88rem; background: var(--moon-soft); border-radius: 14px; padding: 11px 13px; line-height: 1.5; }
.quotes { display: grid; gap: 6px; }
.quote { display: flex; align-items: center; gap: 8px; padding: 9px 11px; border-radius: 12px; background: var(--surface2); font-size: .9rem; }
.quote.best { background: var(--mint-soft); }
.qform { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 6px; }
.sub { font-size: .8rem; font-weight: 700; color: var(--ink2); }

/* rights */
.right { display: grid; gap: 10px; }
.right .head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.amt { font-family: var(--display); font-size: 1.05rem; background: var(--accent-soft); color: var(--ink); border-radius: 12px; padding: 4px 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.who { font-size: .72rem; font-weight: 700; color: var(--accent); letter-spacing: .02em; }
.todo { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem; background: var(--surface2); border-radius: 14px; padding: 11px 13px; }
.src { font-size: .76rem; color: var(--ink3); }
.src a { color: var(--ink2); }
.right.done { opacity: .6; }
details.auto { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
details.auto summary { list-style: none; padding: 16px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
details.auto summary::-webkit-details-marker { display: none; }
details.auto summary::after { content: "+"; font-size: 1.4rem; color: var(--ink3); }
details.auto[open] summary::after { content: "−"; }
details.auto .in { padding: 0 18px 18px; display: grid; gap: 14px; }
.autoitem { display: grid; gap: 2px; border-top: 1px solid var(--line); padding-top: 12px; }
.calcbox { display: grid; gap: 10px; background: var(--surface2); border-radius: 14px; padding: 13px; }
.calcbox .res { font-family: var(--display); font-size: 1.5rem; font-variant-numeric: tabular-nums; }

/* money */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border-radius: 18px; padding: 14px 12px; box-shadow: var(--shadow); display: grid; gap: 2px; }
.kpi .v { font-family: var(--display); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: .74rem; color: var(--ink2); }
.meter { height: 12px; border-radius: 99px; background: var(--surface2); overflow: hidden; display: flex; }
.meter i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .78rem; color: var(--ink2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.exp { display: flex; gap: 10px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.exp:last-child { border-bottom: 0; }
.exp .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.eform { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.eform .full { grid-column: 1 / -1; }
.empty { text-align: center; padding: 22px 10px; color: var(--ink2); display: grid; gap: 4px; justify-items: center; }

/* bottom nav */
nav.tabs { position: fixed; inset: auto 0 0 0; z-index: 20; background: color-mix(in srgb, var(--surface) 88%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs .in { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
nav.tabs button { border: 0; background: none; padding: 9px 2px 10px; display: grid; justify-items: center; gap: 3px; font-size: .74rem; font-weight: 500; color: var(--ink3); }
nav.tabs button svg { width: 25px; height: 25px; }
nav.tabs button.on { color: var(--accent); font-weight: 700; }

/* birth mode */
.birth { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); transition: transform 380ms var(--ease-drawer), opacity 240ms ease; }
.birth[hidden] { display: block !important; transform: translateY(100%); opacity: 0; pointer-events: none; visibility: hidden; transition: transform 240ms var(--ease-out), opacity 200ms ease, visibility 0s 240ms; }
.birth .wrap { max-width: 600px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 40px; display: grid; gap: 16px; }
.bhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.calm { font-family: var(--display); font-size: 1.15rem; color: var(--ink2); text-align: center; }
.timer { display: grid; justify-items: center; gap: 14px; padding: 22px 16px; border-radius: 28px; background: var(--surface); box-shadow: var(--shadow); }
.clock { font-family: var(--display); font-size: 4.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.cbtn { width: 190px; height: 190px; border-radius: 50%; border: 0; font-family: var(--display); font-size: 1.5rem; background: var(--accent); color: #fff; box-shadow: 0 10px 28px color-mix(in srgb, var(--accent) 45%, transparent); }
.cbtn.live { background: var(--coral); box-shadow: 0 10px 28px color-mix(in srgb, var(--coral) 45%, transparent); }
.verdict { width: 100%; border-radius: 16px; padding: 12px 14px; display: grid; gap: 2px; background: var(--accent-soft); font-size: .9rem; }
.verdict.go { background: var(--coral-soft); }
.verdict b { font-family: var(--display); font-weight: 400; font-size: 1.1rem; }
.clog { width: 100%; font-size: .9rem; }
.clog .r { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 6px 2px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.clog .r.h { font-size: .74rem; color: var(--ink3); font-weight: 700; }
.bigacts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.bigact { border: 0; border-radius: 22px; padding: 18px 14px; display: grid; gap: 4px; text-decoration: none; color: var(--ink); background: var(--surface); box-shadow: var(--shadow); text-align: center; justify-items: center; }
.bigact svg { width: 30px; height: 30px; color: var(--accent); }
.bigact b { font-family: var(--display); font-weight: 400; font-size: 1.15rem; }
.bigact span { font-size: .8rem; color: var(--ink2); direction: ltr; }
.warn { background: var(--coral-soft); border-radius: 18px; padding: 14px 16px; font-size: .9rem; }
.warn b { display: block; margin-bottom: 2px; }

.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 99px; font-weight: 500; font-size: .9rem; max-width: calc(100% - 32px); transform: translateX(-50%); transition: transform 300ms var(--ease-out), opacity 200ms ease; }
.toast[hidden] { display: block !important; opacity: 0; transform: translate(-50%, 12px); pointer-events: none; }

.view { animation: viewIn 220ms var(--ease-out); }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) {
  .view { animation: none; }
  .birth, .birth[hidden], .toast, .toast[hidden] { transition: opacity 150ms ease; transform: none; }
  button:active, .press:active { transform: none; }
}
@media (hover: hover) and (pointer: fine) {
  .chip:hover, .pick:hover { background: var(--surface2); }
  .chip.on:hover { background: var(--ink); }

const COLS = ["checks", "expenses", "quotes", "custom", "settings", "live"];
const LS_KEY = "baby-app-v1";
const S = { mode: "local", db: null, data: { checks: {}, expenses: {}, quotes: {}, custom: {}, settings: {}, live: {} }, readOnly: false };
function lsGet(k, f) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch (e) { return f; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
(function loadLocal() { const d = lsGet(LS_KEY, null); if (d) COLS.forEach(c => { S.data[c] = d[c] || {}; }); })();
function saveLocal() { if (S.mode === "local") lsSet(LS_KEY, S.data); }

async function put(col, id, obj) {
  if (S.readOnly) { toast("אין לך הרשאת עריכה בעמוד הזה"); return; }
  S.data[col] = { ...S.data[col], [id]: obj }; render();
  if (S.mode === "db") { try { await S.db.collection(col).doc(id).set(obj); } catch (e) { handleWriteError(e); } }
  else saveLocal();
}
async function del(col, id) {
  if (S.readOnly) { toast("אין לך הרשאת עריכה בעמוד הזה"); return; }
  const next = { ...S.data[col] }; delete next[id]; S.data[col] = next; render();
  if (S.mode === "db") { try { await S.db.collection(col).doc(id).delete(); } catch (e) { handleWriteError(e); } }
  else saveLocal();
}
function handleWriteError(e) {
  if (e && e.code === "invalid_argument") { S.readOnly = true; toast("אין לך הרשאת עריכה. מוצג במצב קריאה בלבד"); }
  else if (e && e.code === "quota_exceeded") toast("האחסון מלא. מחקו כמה רשומות ישנות");
  else toast("השמירה נכשלה. נסו שוב בעוד רגע");
}
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

async function initDb() {
  try {
    if (!window.claude || !window.claude.use) return;
    const db = await window.claude.use("db");
    if (!db) return;
    S.db = db; S.mode = "db";
    COLS.forEach(c => {
      db.collection(c).onSnapshot(snap => {
        const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); });
        S.data[c] = m; scheduleRender();
      }, () => {});
    });

  } catch (e) { /* נשאר מקומי */ }
}

    <label class="f">קטגוריה<select id="e-cat" name="cat">${EXP_CATS.map(c => `<option value="${c.id}">${c.n}</option>`).join("")}</select></label>
    <label class="f">איפה<input id="e-store" name="store" placeholder="חנות / אתר" autocomplete="off"></label>
    <label class="full row" style="gap:8px;font-size:.9rem"><input id="e-income" name="income" type="checkbox" style="width:22px;height:22px"> זו הכנסה (מענק או מתנה בכסף)</label>
    <button class="btn full" type="submit">שמירה</button>
  </form>

  <section class="card"><h3 style="margin-bottom:4px">כל הרשומות</h3>
  ${ex.length ? ex.map(e => { const c = EXP_CATS.find(x => x.id === e.cat) || EXP_CATS[EXP_CATS.length - 1]; return `<div class="exp"><span class="dot" style="background:${e.income ? "var(--mint)" : c.c}"></span><div class="grow"><div style="font-weight:500">${esc(e.name)}</div><div class="tiny">${e.date ? fmtDate(e.date) : ""}${e.store ? " · " + esc(e.store) : ""} · ${e.income ? "הכנסה" : c.n}</div></div><b class="num" style="color:${e.income ? "var(--mint)" : "var(--ink)"}">${e.income ? "+" : ""}${ils(e.amount)}</b><button class="xbtn" data-delexp="${e.id}" aria-label="מחק">×</button></div>`; }).join("") : `<div class="empty"><b>עוד אין רשומות</b><span class="small">אפשר לרשום כאן, או ללחוץ ׳קנינו׳ על מחיר ששמרתם בקניות.</span></div>`}
  </section>`;
}

/* ---------- הגדרות ---------- */
function vSettings() {
  const st = settings(); const lmpDue = st.lmp ? addDays(parse(st.lmp), 280) : null;
  return `<div class="row"><button class="btn soft small" data-go="home">→ חזרה</button><h2>הגדרות</h2></div>
  <form class="card stack" data-settings="1">
    <h3>תאריך הלידה</h3>
    <label class="f">היום הראשון של הווסת האחרונה<input id="st-lmp" name="lmp" type="date" value="${esc(st.lmp)}"><span class="hint">${lmpDue ? "תאריך משוער: " + lmpDue.toLocaleDateString("he-IL", { day: "numeric", month: "long", year: "numeric" }) + " (280 יום)" : "מחשבים ממנו את התאריך המשוער (280 יום)."}</span></label>
    <label class="f">תאריך משוער לפי אולטרסאונד (אם הרופא/ה תיקן/ה)<input id="st-us" name="usDue" type="date" value="${esc(st.usDue)}"><span class="hint">אם ממלאים, הוא גובר על החישוב לפי הווסת. הרבה פעמים מתקנים את התאריך לפי האולטרסאונד של השליש הראשון.</span></label>
    <h3>אתם</h3>
    <div class="eform" style="gap:10px"><label class="f">השם שלך<input id="st-dad" name="dad" value="${esc(st.dad)}" autocomplete="off"></label><label class="f">השם של אשתך<input id="st-mom" name="mom" value="${esc(st.mom)}" autocomplete="off"></label>
    <label class="f full">שם או כינוי לתינוק<input id="st-baby" name="baby" value="${esc(st.baby)}" placeholder="למשל: בייבי, השוקו…" autocomplete="off"></label></div>
    <h3>כסף וטלפונים</h3>
    <label class="f">תקציב לציוד (₪)<input id="st-budget" name="budget" type="number" min="0" value="${esc(st.budget)}"></label>
    <label class="f">טלפון חדר לידה / מיון יולדות בשמיר<input id="st-phone" name="phone" type="tel" value="${esc(st.phone)}" placeholder="לבדוק באתר בית החולים"></label>
    <label class="f">טלפון המוהל<input id="st-mohel" name="mohel" type="tel" value="${esc(st.mohel)}"></label>
    <label class="f">את מי לעדכן כשמתחילים (שורה לכל אחד)<textarea id="st-notify" name="notify">${esc(st.notify)}</textarea></label>
    <button class="btn" type="submit">שמירה</button>
  </form>
  <section class="card stack-s small muted"><b style="color:var(--ink)">שיתוף עם אשתך</b><span>${S.mode === "db" ? "הכול נשמר בענן ומתעדכן אצל מי שקיבל הרשאת עריכה. כדי לשתף: Share בראש העמוד, ואז הרשאת Editor למייל של אשתך." : "כרגע הנתונים נשמרים רק במכשיר הזה."}</span>
  <a href="${SRC.shamir.u}" target="_blank" rel="noopener">אתר המרכז הרפואי שמיר ↗</a></section>`;
}

/* ============================================================
   מצב לידה — טיימר צירים משותף
   ============================================================ */
function contractions() {
  if (S.mode === "db") return Object.assign({ list: [], cur: null }, S.data.live.contractions || {});
  return lsGet("baby-contractions", { list: [], cur: null });
}
function saveContractions(c) { if (S.mode === "db") put("live", "contractions", c); else { lsSet("baby-contractions", c); renderBirth(); } }
let tick, wake = null;
async function openBirth() {
  $("#birth").hidden = false; document.body.style.overflow = "hidden"; renderBirth(); clearInterval(tick); tick = setInterval(updClock, 500);
  try { if (navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); } catch (e) { wake = null; }
}
function closeBirth() { $("#birth").hidden = true; document.body.style.overflow = ""; clearInterval(tick); try { wake && wake.release(); } catch (e) {} wake = null; }
const mmss = ms => { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function updClock() {
  const el = $("#clock"); if (!el) return; const C = contractions();
  if (C.cur) el.textContent = mmss(Date.now() - C.cur);
  else { const last = C.list[C.list.length - 1]; el.textContent = last ? mmss(Date.now() - last.e) : "0:00"; }
}
function analysis(L) {
  L = L.slice(-8); if (L.length < 3) return null;
  const ints = []; for (let k = 1; k < L.length; k++) ints.push(L[k].s - L[k - 1].s);
  const avgI = ints.reduce((a, b) => a + b, 0) / ints.length; const avgD = L.reduce((a, c) => a + (c.e - c.s), 0) / L.length;
  return { avgI, avgD, go: avgI <= 5.5 * 60e3 && avgD >= 45e3 };
}
let resetArm = false;
function renderBirth() {
  const st = settings(); const C = contractions(); const L = C.list; const an = analysis(L);
  const rows = L.slice(-8).reverse().map((c, k, arr) => { const prev = arr[k + 1]; return `<div class="r"><span>${new Date(c.s).toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" })}</span><span>${mmss(c.e - c.s)}</span><span>${prev ? mmss(c.s - prev.s) : "—"}</span></div>`; }).join("");
  const waze = "https://waze.com/ul?q=" + encodeURIComponent("המרכז הרפואי שמיר אסף הרופא") + "&navigate=yes";
  $("#birth").innerHTML = `<div class="wrap">
  <div class="bhead"><h2>מצב לידה</h2><button class="btn soft" data-closebirth="1">סגירה</button></div>
  <p class="calm">נושמים. יש זמן. אתם מוכנים לזה.</p>
  <section class="timer"><span class="muted small">${C.cur ? "ציר עכשיו" : "מאז הציר האחרון"}</span><div class="clock" id="clock">0:00</div>
    <button class="cbtn ${C.cur ? "live" : ""}" data-contraction="1">${C.cur ? "הציר נגמר" : "התחיל ציר"}</button>
    ${an ? `<div class="verdict ${an.go ? "go" : ""}"><b>${an.go ? "הצירים סדירים. זה הזמן להתקשר לחדר הלידה" : "ממשיכים לעקוב"}</b><span>ציר כל ${mmss(an.avgI)} דק׳, באורך ${mmss(an.avgD)}. בלידה ראשונה הכלל המקובל לנסיעה הוא 5-1-1, אלא אם הצוות אמר אחרת.</span></div>` : `<span class="tiny">לוחצים כשציר מתחיל ושוב כשהוא נגמר. ${S.mode === "db" ? "הטיימר משותף לשני הטלפונים." : ""}</span>`}
    ${L.length ? `<div class="clog"><div class="r h"><span>שעה</span><span>אורך</span><span>מרווח</span></div>${rows}</div><button class="btn soft small" data-resetc="1">${resetArm ? "ללחוץ שוב לאישור" : "איפוס"}</button>` : ""}
  </section>
  <div class="bigacts">
    <a class="bigact press" href="${waze}" target="_blank" rel="noopener">${IC.nav}<b>ניווט לשמיר</b><span>Waze</span></a>
    ${st.phone ? `<a class="bigact press" href="tel:${esc(st.phone.replace(/[^\d+]/g, ""))}">${IC.phone}<b>חדר לידה</b><span style="user-select:all">${esc(st.phone)}</span></a>` : `<button class="bigact" data-go-settings="1">${IC.phone}<b>חדר לידה</b><span>להוסיף מספר</span></button>`}
  </div>
  <div class="warn"><b>נוסעים מיד, בלי לחכות לצירים, אם:</b>ירדו מים, יש דימום, התינוק זז פחות, או יש כאב חזק שלא עובר. בכל ספק, להתקשר לחדר הלידה.</div>
  <section class="card stack-s"><h3>לפני שיוצאים</h3>
    ${["x-bag|תיק לידה", "x-docs|תיקיית מסמכים ותעודות זהות", "x-charge|מטענים וטלפונים", "x-seat|הסלקל מותקן בסיוויק", "x-home|לנעול ולכבות גז"].map(s => { const [id, t] = s.split("|"); return taskRow({ id, t }); }).join("")}
  </section>
  <section class="card stack-s"><h3>את מי לעדכן</h3>
    ${st.notify.split("\n").map(n => n.trim()).filter(Boolean).map((n, k) => taskRow({ id: "n-" + k, t: n })).join("") || '<span class="tiny">מוסיפים אנשים בהגדרות.</span>'}
  </section></div>`;
  updClock();
}
document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible" && !$("#birth").hidden && !wake) { try { if (navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); } catch (e) {} } });

/* ============================================================
   אירועים
   ============================================================ */
document.addEventListener("click", e => {
  const t = e.target.closest("button, a"); if (!t) return;
  const d = t.dataset;
  if (d.go) { if (!$("#birth").hidden) closeBirth(); go(d.go); return; }
  if (d.goSettings) { closeBirth(); go("settings"); return; }
  if (d.toggle) { const was = isDone(d.toggle); toggle(d.toggle); if (!was && UI.tab === "home") toast("כל הכבוד ✓"); return; }
  if (d.open) { UI.open[d.open] = !UI.open[d.open]; saveUI(); render(); return; }
  if (d.shopcat) { UI.shopCat = d.shopcat; saveUI(); render(); return; }
  if (d.bagtab) { UI.bagTab = d.bagtab; saveUI(); render(); return; }
  if (d.taskseg) { UI.taskSeg = d.taskseg; saveUI(); render(); return; }
  if (d.pick) { const cur = S.data.checks["pick-" + d.pick]; if (cur && cur.n === d.name) del("checks", "pick-" + d.pick); else put("checks", "pick-" + d.pick, { n: d.name, at: Date.now() }); return; }
  if (d.delcustom) { del("custom", d.delcustom); return; }
  if (d.delquote) { del("quotes", d.delquote); return; }
  if (d.delexp) { del("expenses", d.delexp); return; }
  if (d.buyquote) {
    const q = S.data.quotes[d.buyquote]; if (!q) return;
    const it = allShopItems().find(i => i.id === q.item); const cat = SHOP.find(c => it && c.items.includes(it));
    put("expenses", newId(), { name: it ? it.name : q.store, amount: q.price, store: q.store, cat: cat ? cat.id : "other", date: iso(new Date()), at: Date.now() });
    if (it && !isDone(it.id)) put("checks", it.id, { done: true, at: Date.now() });
    toast("נרשם בהוצאות וסומן כנקנה"); return;
  }
  if (d.birth) { openBirth(); return; }
  if (d.closebirth) { closeBirth(); render(); return; }
  if (d.contraction) {
    const C = contractions(); const n = { list: C.list.slice(-60), cur: C.cur };
    if (n.cur) { n.list.push({ s: n.cur, e: Date.now() }); n.cur = null; } else n.cur = Date.now();
    saveContractions(n); return;
  }
  if (d.resetc) {
    if (resetArm) { resetArm = false; saveContractions({ list: [], cur: null }); }
    else { resetArm = true; renderBirth(); setTimeout(() => { resetArm = false; if (!$("#birth").hidden) renderBirth(); }, 4000); }
    return;
  }
});
document.addEventListener("submit", e => {
  const f = e.target; e.preventDefault(); const d = f.dataset; const fd = new FormData(f);
  const blur = () => { if (document.activeElement) document.activeElement.blur(); };
  if (d.addcustom) { const text = (fd.get("text") || "").trim(); if (!text) return; f.reset(); blur(); put("custom", newId(), { list: d.addcustom, text, at: Date.now() }); return; }
  if (d.addquote) { const store = (fd.get("store") || "").trim(); const price = +fd.get("price"); if (!store || !(price >= 0)) return; f.reset(); blur(); put("quotes", newId(), { item: d.addquote, store, price, at: Date.now() }); toast("המחיר נשמר"); return; }
  if (d.gift) { const by = (fd.get("by") || "").trim(); blur(); if (by) put("checks", "gift-" + d.gift, { by, at: Date.now() }); else del("checks", "gift-" + d.gift); toast(by ? "נרשם כמתנה" : "הוסר"); return; }
  if (d.addexp) {
    const name = (fd.get("name") || "").trim(); const amount = +fd.get("amount"); if (!name || !(amount >= 0)) return;
    const obj = { name, amount, date: fd.get("date") || "", cat: fd.get("cat"), store: (fd.get("store") || "").trim(), income: !!fd.get("income"), at: Date.now() };
    f.reset(); blur(); put("expenses", newId(), obj); toast("נשמר"); return;
  }
  if (d.settings) {
    const g = k => (fd.get(k) || "").toString().trim();
    blur(); put("settings", "main", { lmp: g("lmp"), usDue: g("usDue"), budget: +g("budget") || 0, phone: g("phone"), mohel: g("mohel"), notify: fd.get("notify") || "", baby: g("baby"), mom: g("mom"), dad: g("dad") });
    toast("ההגדרות נשמרו"); return;
  }
});
document.addEventListener("input", e => {
  if (e.target.dataset && e.target.dataset.sal) { const v = +e.target.value || 0; lsSet("baby-sal", v); const r = $("#calcres"); if (r) r.innerHTML = calcText(v); }
});

render(true);
initDb();

</script>
